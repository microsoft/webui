trigger: none
pr: none

parameters:
- name: validationMode
  displayName: Generate signed artifacts without external publication
  type: string
  default: 'false'
  values:
  - 'false'
  - 'true'

resources:
  pipelines:
  - pipeline: releaseBuild
    source: Web UI - CD Build
    # Manual Run Pipeline selection may intentionally override this default.
    branch: refs/heads/main
    trigger:
      branches:
        include:
        - main
      stages:
      - BuildRelease
  repositories:
  - repository: webuiPipelines
    type: git
    name: open-source/WebUIPipelineTemplates
    ref: main
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  # The pipeline extends the 1ES PT, which injects SDL and compliance tasks.
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: OneESPool
      image: HostedPoolLinuxImage
      os: linux
    sdl:
      sourceAnalysisPool:
        name: OneESPool
        image: HostedPoolWindowsImage
        os: windows
    settings:
      networkIsolationPolicy: Permissive
    stages:
    - stage: Release
      displayName: Sign and publish release
      jobs:
      - job: SignAndPublish
        displayName: Sign and publish release
        templateContext:
          outputs:
          - output: pipelineArtifact
            targetPath: '$(Build.SourcesDirectory)/publish_artifacts_npm'
            artifactName: unsigned_npm_packages
            displayName: Publish unsigned npm packages
          - output: pipelineArtifact
            targetPath: '$(Build.SourcesDirectory)/publish_artifacts_crates'
            artifactName: unsigned_crate_packages
            displayName: Publish unsigned crate packages
          - output: pipelineArtifact
            targetPath: '$(Build.ArtifactStagingDirectory)/publish_artifacts_nuget'
            artifactName: signed_nuget_packages
            displayName: Publish signed NuGet packages
          - output: pipelineArtifact
            targetPath: '$(Build.SourcesDirectory)/publish_artifacts_standalone'
            artifactName: standalone_release_assets
            displayName: Publish standalone release assets
        steps:
        - checkout: self
          clean: true
          persistCredentials: true

        - download: releaseBuild
          artifact: release-metadata
          displayName: Download release metadata

        - task: Bash@3
          displayName: Read release metadata
          inputs:
            targetType: inline
            script: |
              #!/usr/bin/env bash
              # Copyright (c) Microsoft Corporation.
              # Licensed under the MIT license.

              # Restore the release identity selected by Web UI - CD Build.
              set -euo pipefail

              : "${METADATA_INPUT_DIR:?METADATA_INPUT_DIR is required}"
              : "${EXPECTED_VALIDATION_MODE:?EXPECTED_VALIDATION_MODE is required}"

              read_metadata_file() {
                local path=$1
                local name=$2
                local value

                if [[ ! -f "$path" ]]; then
                  echo "Required build metadata file is missing: ${path}" >&2
                  return 1
                fi
                if [[ $(wc -l < "$path") -ne 1 ]]; then
                  echo "Build metadata file must contain exactly one newline-terminated line: ${path}" >&2
                  return 1
                fi

                value=$(cat "$path")
                if [[ -z "$value" || "$value" == *$'\n'* ]]; then
                  echo "Build metadata file contains an invalid ${name}: ${path}" >&2
                  return 1
                fi
                printf '%s' "$value"
              }

              release_tag=$(read_metadata_file "$METADATA_INPUT_DIR/release-tag.txt" "release tag")
              release_commit=$(read_metadata_file "$METADATA_INPUT_DIR/release-commit.txt" "release commit")
              release_version=$(read_metadata_file "$METADATA_INPUT_DIR/release-version.txt" "release version")
              validation_mode=$(read_metadata_file "$METADATA_INPUT_DIR/validation-mode.txt" "validation mode")

              if [[ ! "$release_tag" =~ ^v.+$ ]]; then
                echo "Build metadata release tag must be v-prefixed." >&2
                exit 1
              fi
              if [[ ! "$release_commit" =~ ^[0-9a-f]{40}$ ]]; then
                echo "Build metadata release commit must be 40-character lowercase hexadecimal." >&2
                exit 1
              fi
              if [[ "$release_version" != "${release_tag#v}" ]]; then
                echo "Build metadata release version must equal the release tag without its v prefix." >&2
                exit 1
              fi
              if [[ "$validation_mode" != true && "$validation_mode" != false ]]; then
                echo "Build metadata validation mode must be true or false." >&2
                exit 1
              fi
              if [[ "$validation_mode" != "$EXPECTED_VALIDATION_MODE" ]]; then
                echo "Build metadata validation mode ${validation_mode} does not match CD validation mode ${EXPECTED_VALIDATION_MODE}." >&2
                exit 1
              fi

              echo "Selected build metadata: ${release_tag} (${release_commit}), version ${release_version}, validationMode=${validation_mode}"
              if [[ -n "${BUILD_BUILDID:-}" ]]; then
                echo "##vso[build.updatebuildnumber]${release_tag}-cd-${BUILD_BUILDID}"
              fi
              echo "##vso[task.setvariable variable=releaseVersion]${release_version}"
              echo "##vso[task.setvariable variable=releaseTag]${release_tag}"
              echo "##vso[task.setvariable variable=releaseCommit]${release_commit}"
          env:
            METADATA_INPUT_DIR: $(Pipeline.Workspace)/releaseBuild/release-metadata
            EXPECTED_VALIDATION_MODE: ${{ parameters.validationMode }}

        - download: releaseBuild
          artifact: unsigned_npm_packages
          displayName: Download unsigned npm packages

        - download: releaseBuild
          artifact: unsigned_crate_packages
          displayName: Download unsigned crate packages

        - download: releaseBuild
          artifact: nuget_signing_input
          displayName: Download NuGet signing input

        - download: releaseBuild
          artifact: standalone_release_assets
          displayName: Download standalone release assets

        - task: Bash@3
          displayName: Stage release artifacts
          inputs:
            targetType: inline
            script: |
              #!/usr/bin/env bash
              # Copyright (c) Microsoft Corporation.
              # Licensed under the MIT license.

              set -euo pipefail

              : "${BUILD_SOURCES_DIRECTORY:?BUILD_SOURCES_DIRECTORY is required}"
              : "${PIPELINE_WORKSPACE:?PIPELINE_WORKSPACE is required}"

              for artifact_mapping in \
                unsigned_npm_packages:publish_artifacts_npm \
                unsigned_crate_packages:publish_artifacts_crates \
                nuget_signing_input:publish_artifacts_nuget \
                standalone_release_assets:publish_artifacts_standalone; do
                artifact_name=${artifact_mapping%%:*}
                publish_dir=${artifact_mapping#*:}
                source_dir="${PIPELINE_WORKSPACE}/releaseBuild/${artifact_name}"
                destination_dir="${BUILD_SOURCES_DIRECTORY}/${publish_dir}"

                if [[ ! -d "$source_dir" ]]; then
                  echo "Downloaded build artifact directory is missing: ${source_dir}" >&2
                  echo "Select a Web UI - CD Build run that assembled all required artifacts." >&2
                  exit 1
                fi
                if [[ -z "$(find "$source_dir" -mindepth 1 -maxdepth 1 -print -quit)" ]]; then
                  echo "Downloaded build artifact directory is empty: ${source_dir}" >&2
                  echo "Select a successful Web UI - CD Build run with assembled release artifacts." >&2
                  exit 1
                fi

                rm -rf -- "$destination_dir"
                mkdir -p "$destination_dir"
                cp -R "$source_dir"/. "$destination_dir"/
              done

              echo "Staged all release package sets and standalone assets."
          env:
            BUILD_SOURCES_DIRECTORY: $(Build.SourcesDirectory)
            PIPELINE_WORKSPACE: $(Pipeline.Workspace)

        - task: UseDotNet@2
          displayName: Install .NET 8 SDK for ESRP
          inputs:
            packageType: sdk
            version: 8.x

        - template: WebUI.Sign.PipelineTemplate.yml@webuiPipelines

        - ${{ if eq(parameters.validationMode, 'false') }}:
          - task: Bash@3
            displayName: Ensure release tag
            inputs:
              targetType: inline
              script: |
                #!/usr/bin/env bash
                # Copyright (c) Microsoft Corporation.
                # Licensed under the MIT license.

                # Create the annotated Git tag consumed by the GitHub Release task.
                set -euo pipefail

                : "${RELEASE_TAG:?RELEASE_TAG is required}"
                : "${RELEASE_COMMIT:?RELEASE_COMMIT is required}"

                is_stable_version() {
                  local value="$1"
                  local major minor patch extra

                  [[ "$value" != *$'\n'* ]] || return 1
                  IFS=. read -r major minor patch extra <<<"$value"
                  [[ -n "$major" && -n "$minor" && -n "$patch" && -z "${extra:-}" ]] || return 1
                  [[ -z "${major//[0-9]/}" && -z "${minor//[0-9]/}" && -z "${patch//[0-9]/}" ]] ||
                    return 1
                  [[ "$major" == 0 || "$major" != 0* ]] &&
                    [[ "$minor" == 0 || "$minor" != 0* ]] &&
                    [[ "$patch" == 0 || "$patch" != 0* ]]
                }

                is_commit_id() {
                  local value="$1"
                  [[ ${#value} -eq 40 && -z "${value//[0-9a-f]/}" ]]
                }

                if [[ "$RELEASE_TAG" == *$'\n'* || "${RELEASE_TAG#v}" == "$RELEASE_TAG" ]] ||
                  ! is_stable_version "${RELEASE_TAG#v}"; then
                  echo "RELEASE_TAG must exactly match vMAJOR.MINOR.PATCH." >&2
                  exit 1
                fi
                if ! is_commit_id "$RELEASE_COMMIT"; then
                  echo "RELEASE_COMMIT must be a 40-character lowercase commit ID." >&2
                  exit 1
                fi

                remote_tag_commit() {
                  local output status commit

                  set +e
                  output=$(git ls-remote --exit-code origin \
                    "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}" 2>&1)
                  status=$?
                  set -e
                  if (( status == 2 )); then
                    return 1
                  fi
                  if (( status != 0 )); then
                    echo "Unable to query ${RELEASE_TAG} from origin: ${output}" >&2
                    return 2
                  fi

                  commit=$(printf '%s\n' "$output" |
                    awk -v ref="refs/tags/${RELEASE_TAG}^{}" '$2 == ref { print $1; exit }')
                  if [[ -z "$commit" ]]; then
                    commit=$(printf '%s\n' "$output" |
                      awk -v ref="refs/tags/${RELEASE_TAG}" '$2 == ref { print $1; exit }')
                  fi
                  if ! is_commit_id "$commit"; then
                    echo "Remote tag ${RELEASE_TAG} did not peel to a valid commit ID." >&2
                    return 2
                  fi
                  printf '%s\n' "$commit"
                }

                git fetch origin --tags
                if ! git cat-file -e "${RELEASE_COMMIT}^{commit}" 2>/dev/null; then
                  git fetch --no-tags origin "$RELEASE_COMMIT"
                fi
                if ! git cat-file -e "${RELEASE_COMMIT}^{commit}" 2>/dev/null; then
                  echo "RELEASE_COMMIT does not identify a commit available from origin." >&2
                  exit 1
                fi

                if existing_commit=$(remote_tag_commit); then
                  if [[ "$existing_commit" != "$RELEASE_COMMIT" ]]; then
                    echo "Remote tag ${RELEASE_TAG} points to ${existing_commit}, not ${RELEASE_COMMIT}." >&2
                    exit 1
                  fi
                  echo "Remote tag ${RELEASE_TAG} already points to ${RELEASE_COMMIT}."
                  exit 0
                else
                  status=$?
                  if (( status != 1 )); then
                    exit 1
                  fi
                fi

                git config user.name "Azure Pipelines"
                git config user.email "azure-pipelines@microsoft.com"
                if git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"; then
                  git tag -d "$RELEASE_TAG"
                fi
                git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "Release ${RELEASE_TAG}"

                if git push origin "refs/tags/${RELEASE_TAG}"; then
                  echo "Created annotated release tag ${RELEASE_TAG} at ${RELEASE_COMMIT}."
                  exit 0
                fi

                echo "Tag push failed; checking whether another release run created the same tag." >&2
                git fetch --force origin \
                  "refs/tags/${RELEASE_TAG}:refs/azure-release-tags/${RELEASE_TAG}"
                raced_commit=$(git rev-parse "refs/azure-release-tags/${RELEASE_TAG}^{}")
                if ! is_commit_id "$raced_commit"; then
                  echo "Concurrent remote tag ${RELEASE_TAG} did not peel to a valid commit ID." >&2
                  exit 1
                fi
                if [[ "$raced_commit" != "$RELEASE_COMMIT" ]]; then
                  echo "Concurrent remote tag ${RELEASE_TAG} points to ${raced_commit}, not ${RELEASE_COMMIT}." >&2
                  exit 1
                fi
                echo "Concurrent release run created ${RELEASE_TAG} at the expected commit."
            env:
              RELEASE_TAG: $(releaseTag)
              RELEASE_COMMIT: $(releaseCommit)

          - task: GitHubRelease@1
            displayName: Create or update GitHub Release
            inputs:
              gitHubConnection: fast
              repositoryName: microsoft/webui
              action: edit
              target: $(releaseCommit)
              tag: $(releaseTag)
              title: $(releaseTag)
              releaseNotesSource: inline
              releaseNotesInline: 'Automated WebUI release.'
              addChangeLog: false
              assets: |
                $(Build.SourcesDirectory)/publish_artifacts_npm/*
                $(Build.ArtifactStagingDirectory)/publish_artifacts_nuget/*
                $(Build.SourcesDirectory)/publish_artifacts_crates/*
                $(Build.SourcesDirectory)/publish_artifacts_standalone/*
              assetUploadMode: replace
              isDraft: false
              isPreRelease: false
              makeLatest: legacy

          - template: WebUI.Release.PipelineTemplate.yml@webuiPipelines
