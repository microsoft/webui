trigger: none
pr: none

# Optional: set targetReleaseTag to a v-prefixed GitHub tag for manual reprocessing.
variables:
  targetReleaseTag: ''

schedules:
  - cron: '0 * * * *'
    displayName: Hourly deployment check
    branches:
      include:
        - main
    always: true  # run even when there are no new commits — needed since we check an external GitHub release, not repo changes

# The `resources` specify the location and version of the 1ES PT.
resources:
  repositories:
  - repository: webuiPipelines
    type: git
    name: open-source/WebUIPipelineTemplates
    ref: main
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  # The pipeline extends the 1ES PT which will inject different SDL and compliance tasks.
  # For non-production pipelines, use "Unofficial" as defined below.
  # For productions pipelines, use "Official".
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    # Update the pool with your team's 1ES hosted pool.
    pool:
      name: OneESPool  # Name of your hosted pool
      image: HostedPoolLinuxImage  # Name of the image in your pool. If not specified, first image of the pool is used
      os: linux  # OS of the image. This value cannot be a variable. Allowed values: windows, linux, macOS
    sdl:
      sourceAnalysisPool:
        name: OneESPool  # Name of your hosted pool
        image: HostedPoolWindowsImage  # Name of the image in your pool. If not specified, first image of the pool is used
        os: windows  # OS of the image. Allowed values: windows, linux, macOS
    settings:
      networkIsolationPolicy: Permissive
    stages:

    # ── Stage 1: Lightweight version check (runs every hour, ~1-2 min) ──
    # This stage is separate so hourly runs can skip the heavyweight Package
    # stage when the target release has already been deployed.
    - stage: Check
      jobs:
      - job: CheckVersion
        steps:
          - checkout: self
            persistCredentials: "true"

          - script: |
              set -euo pipefail

              if command -v gh >/dev/null 2>&1; then
                gh --version
                exit 0
              fi

              echo "GitHub CLI is not preinstalled; installing it from the official apt repository."
              sudo mkdir -p -m 755 /etc/apt/keyrings
              wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg \
                | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
              sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
                | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
              sudo apt-get update -qq
              sudo apt-get install -y gh
              gh --version
            displayName: Ensure GitHub CLI is available

          - script: |
              set -euo pipefail

              if [ -z "${GH_TOKEN:-}" ] \
                || { [ "${GH_TOKEN:0:1}" = '$' ] && [ "${GH_TOKEN:1:1}" = '(' ]; }; then
                echo "##vso[task.logissue type=error]GH_TOKEN is unavailable. Configure it as a secret Azure Pipeline variable with read access to microsoft/webui releases."
                exit 1
              fi

              REQUESTED_TAG="${TARGET_RELEASE_TAG:-}"
              if [ -n "$REQUESTED_TAG" ]; then
                case "$REQUESTED_TAG" in
                  v?*) ;;
                  *)
                    echo "##vso[task.logissue type=error]targetReleaseTag must be a v-prefixed GitHub release tag, for example v0.0.19."
                    exit 1
                    ;;
                esac

                if ! RELEASE_TAG=$(gh release view "$REQUESTED_TAG" --repo microsoft/webui --json tagName --jq .tagName); then
                  echo "##vso[task.logissue type=error]Unable to resolve pinned GitHub release ${REQUESTED_TAG}."
                  exit 1
                fi
                if [ "$RELEASE_TAG" != "$REQUESTED_TAG" ]; then
                  echo "##vso[task.logissue type=error]Pinned release resolved to unexpected tag ${RELEASE_TAG}; expected ${REQUESTED_TAG}."
                  exit 1
                fi
              else
                if ! RELEASE_TAG=$(gh release view --repo microsoft/webui --json tagName --jq .tagName); then
                  echo "##vso[task.logissue type=error]Unable to resolve the latest microsoft/webui GitHub release."
                  exit 1
                fi
              fi

              case "$RELEASE_TAG" in
                v?*) ;;
                *)
                  echo "##vso[task.logissue type=error]Resolved release tag ${RELEASE_TAG} is not v-prefixed."
                  exit 1
                  ;;
              esac

              VERSION="${RELEASE_TAG#v}"
              echo "Resolved GitHub release: ${RELEASE_TAG}"
              echo "##vso[task.setvariable variable=releaseVersion]${VERSION}"
              echo "##vso[task.setvariable variable=releaseVersion;isOutput=true]${VERSION}"
              echo "##vso[task.setvariable variable=releaseTag;isOutput=true]${RELEASE_TAG}"
            displayName: Resolve GitHub release
            name: resolveTag
            env:
              GH_TOKEN: $(GH_TOKEN)
              GH_NO_UPDATE_NOTIFIER: '1'
              GH_PROMPT_DISABLED: '1'
              TARGET_RELEASE_TAG: $(targetReleaseTag)

          # Check whether this version has already been deployed by looking
          # for a "deployed/vX.Y.Z" git tag. This avoids external network
          # calls to npm/crates.io which are unreachable from 1ES agents.
          # The Deploy job pushes this tag after a successful deployment.
          - script: |
              set -euo pipefail
              VERSION="$(releaseVersion)"
              DEPLOY_TAG="deployed/v${VERSION}"

              git fetch --tags --quiet
              if git tag -l "${DEPLOY_TAG}" | grep -q .; then
                echo "${DEPLOY_TAG} tag exists — version ${VERSION} already deployed"
                echo "##vso[task.setvariable variable=needsDeployment;isOutput=true]false"
              else
                echo "${DEPLOY_TAG} tag not found — version ${VERSION} needs deployment"
                echo "##vso[task.setvariable variable=needsDeployment;isOutput=true]true"
              fi
            displayName: Check if already deployed
            name: deploymentCheck

    # ── Stage 2: Deploy when needed; manual runs may reprocess the target tag ──
    - stage: Package
      dependsOn: Check
      condition: and(succeeded(), or(eq(variables['Build.Reason'], 'Manual'), eq(dependencies.Check.outputs['CheckVersion.deploymentCheck.needsDeployment'], 'true')))
      variables:
        releaseTag: $[ stageDependencies.Check.CheckVersion.outputs['resolveTag.releaseTag'] ]
      jobs:
      - job: Deploy
        templateContext:
          outputs:
            - output: pipelineArtifact
              targetPath: '$(Build.ArtifactStagingDirectory)/publish_artifacts_nuget'
              artifactName: nuget_packages
              displayName: Publish signed NuGet packages
        steps:
          - checkout: self
            persistCredentials: "true"

          - task: UseDotNet@2
            displayName: Install .NET 8 SDK for ESRP
            inputs:
              packageType: sdk
              version: '8.x'

          - script: |
              set -euo pipefail

              if command -v gh >/dev/null 2>&1; then
                gh --version
                exit 0
              fi

              echo "GitHub CLI is not preinstalled; installing it from the official apt repository."
              sudo mkdir -p -m 755 /etc/apt/keyrings
              wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg \
                | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null
              sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
                | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
              sudo apt-get update -qq
              sudo apt-get install -y gh
              gh --version
            displayName: Ensure GitHub CLI is available

          - script: |
              set -euo pipefail

              if [ -z "${GH_TOKEN:-}" ] \
                || { [ "${GH_TOKEN:0:1}" = '$' ] && [ "${GH_TOKEN:1:1}" = '(' ]; }; then
                echo "##vso[task.logissue type=error]GH_TOKEN is unavailable. Configure it as a secret Azure Pipeline variable with read access to microsoft/webui releases."
                exit 1
              fi

              RELEASE_TAG="${CHECKED_RELEASE_TAG:-}"
              case "$RELEASE_TAG" in
                v?*) ;;
                *)
                  echo "##vso[task.logissue type=error]Check did not provide a valid v-prefixed release tag."
                  exit 1
                  ;;
              esac

              if ! CONFIRMED_TAG=$(gh release view "$RELEASE_TAG" --repo microsoft/webui --json tagName --jq .tagName); then
                echo "##vso[task.logissue type=error]Unable to verify checked GitHub release ${RELEASE_TAG}."
                exit 1
              fi
              if [ "$CONFIRMED_TAG" != "$RELEASE_TAG" ]; then
                echo "##vso[task.logissue type=error]Checked release ${RELEASE_TAG} resolved to unexpected tag ${CONFIRMED_TAG}."
                exit 1
              fi

              if ! RELEASE_ID=$(gh release view "$RELEASE_TAG" --repo microsoft/webui --json databaseId --jq .databaseId); then
                echo "##vso[task.logissue type=error]Unable to resolve the GitHub release ID for ${RELEASE_TAG}."
                exit 1
              fi

              DOWNLOAD_DIR="${ARTIFACTS_DIR}/release-assets"
              EXPECTED_ASSETS="${ARTIFACTS_DIR}/expected-release-assets.txt"
              ACTUAL_ASSETS="${ARTIFACTS_DIR}/downloaded-release-assets.txt"
              rm -rf "$DOWNLOAD_DIR"
              mkdir -p "$DOWNLOAD_DIR"

              # FIXME(#22397): Remove this GitHub CLI workaround after DownloadGitHubRelease@0
              # supports paginated release assets: https://github.com/microsoft/azure-pipelines-tasks/pull/22397
              if ! gh api --paginate "/repos/microsoft/webui/releases/${RELEASE_ID}/assets?per_page=100" --jq '.[].name' > "$EXPECTED_ASSETS"; then
                echo "##vso[task.logissue type=error]Unable to list all assets for GitHub release ${RELEASE_TAG}."
                exit 1
              fi
              LC_ALL=C sort -o "$EXPECTED_ASSETS" "$EXPECTED_ASSETS"

              EXPECTED_COUNT=$(wc -l < "$EXPECTED_ASSETS" | tr -d ' ')
              if [ "$EXPECTED_COUNT" -eq 0 ]; then
                echo "##vso[task.logissue type=error]GitHub release ${RELEASE_TAG} has no downloadable assets."
                exit 1
              fi

              if ! gh release download "$RELEASE_TAG" --repo microsoft/webui --dir "$DOWNLOAD_DIR"; then
                echo "##vso[task.logissue type=error]Failed to download all assets for GitHub release ${RELEASE_TAG}."
                exit 1
              fi

              find "$DOWNLOAD_DIR" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
                | LC_ALL=C sort > "$ACTUAL_ASSETS"
              if ! diff -u "$EXPECTED_ASSETS" "$ACTUAL_ASSETS"; then
                echo "##vso[task.logissue type=error]Downloaded assets do not match the complete paginated asset list for ${RELEASE_TAG}."
                exit 1
              fi

              echo "Downloaded all ${EXPECTED_COUNT} assets for ${RELEASE_TAG}."
            displayName: Download all checked GitHub release artifacts
            env:
              ARTIFACTS_DIR: $(System.ArtifactsDirectory)
              CHECKED_RELEASE_TAG: $(releaseTag)
              GH_TOKEN: $(GH_TOKEN)
              GH_NO_UPDATE_NOTIFIER: '1'
              GH_PROMPT_DISABLED: '1'

          # Stage downloaded files in the directories expected by
          # WebUI.Sign.PipelineTemplate.yml: .tgz → npm, .crate → crates, and
          # .nupkg/.snupkg → NuGet.
          - script: |
              mkdir -p publish_artifacts_npm publish_artifacts_crates publish_artifacts_nuget
              find "$(System.ArtifactsDirectory)" -name "*.tgz"   -exec cp {} publish_artifacts_npm/   \;
              find "$(System.ArtifactsDirectory)" -name "*.crate" -exec cp {} publish_artifacts_crates/ \;
              find "$(System.ArtifactsDirectory)" -name "*.nupkg" -exec cp {} publish_artifacts_nuget/ \;
              find "$(System.ArtifactsDirectory)" -name "*.snupkg" -exec cp {} publish_artifacts_nuget/ \;

              echo "npm artifacts:"
              ls publish_artifacts_npm/
              echo "crate artifacts:"
              ls publish_artifacts_crates/
              echo "NuGet artifacts:"
              ls publish_artifacts_nuget/
            displayName: Separate release artifacts

          - template: WebUI.Sign.PipelineTemplate.yml@webuiPipelines  # Template reference
          - template: WebUI.Release.PipelineTemplate.yml@webuiPipelines  # Template reference

          # Mark this version as deployed so future pipeline runs skip it.
          # Uses the releaseTag stage variable (e.g. "v0.0.8") to create
          # a "deployed/v0.0.8" tag and push it back to the repo.
          - script: |
              set -euo pipefail
              DEPLOY_TAG="deployed/$(releaseTag)"
              echo "Tagging successful deployment: ${DEPLOY_TAG}"
              git tag "${DEPLOY_TAG}"
              git push origin "${DEPLOY_TAG}"
            displayName: Tag successful deployment
