trigger: none
pr: none

parameters:
- name: validationMode
  displayName: Generate signed artifacts without external publication
  type: string
  default: 'false'
  values:
  - 'false'
  - 'true'

resources:
  pipelines:
  - pipeline: releaseBuild
    source: Web UI - CD Build
    # Manual Run Pipeline selection may intentionally override this default.
    branch: refs/heads/main
    trigger:
      branches:
        include:
        - main
      stages:
      - BuildRelease
  repositories:
  - repository: webuiPipelines
    type: git
    name: open-source/WebUIPipelineTemplates
    ref: main
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  # The pipeline extends the 1ES PT, which injects SDL and compliance tasks.
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: OneESPool
      image: HostedPoolLinuxImage
      os: linux
    sdl:
      sourceAnalysisPool:
        name: OneESPool
        image: HostedPoolWindowsImage
        os: windows
    settings:
      networkIsolationPolicy: Permissive
    stages:
    - stage: Release
      displayName: Sign and publish release
      jobs:
      - job: SignAndPublish
        displayName: Sign and publish release
        templateContext:
          outputs:
          - output: pipelineArtifact
            targetPath: '$(Build.SourcesDirectory)/publish_artifacts_npm'
            artifactName: unsigned_npm_packages
            displayName: Publish unsigned npm packages
          - output: pipelineArtifact
            targetPath: '$(Build.SourcesDirectory)/publish_artifacts_crates'
            artifactName: unsigned_crate_packages
            displayName: Publish unsigned crate packages
          - output: pipelineArtifact
            targetPath: '$(Build.ArtifactStagingDirectory)/publish_artifacts_nuget'
            artifactName: signed_nuget_packages
            displayName: Publish signed NuGet packages
          - output: pipelineArtifact
            targetPath: '$(Build.SourcesDirectory)/publish_artifacts_standalone'
            artifactName: standalone_release_assets
            displayName: Publish standalone release assets
        steps:
        - checkout: self
          clean: true
          persistCredentials: true

        - download: releaseBuild
          artifact: release-metadata
          displayName: Download release metadata

        - download: releaseBuild
          artifact: release-tools
          displayName: Download release orchestration tool

        - task: Bash@3
          displayName: Read release metadata
          inputs:
            targetType: inline
            script: |
              set -euo pipefail
              chmod +x "$RELEASE_XTASK"
              "$RELEASE_XTASK" release-read-metadata
          env:
            RELEASE_XTASK: $(Pipeline.Workspace)/releaseBuild/release-tools/xtask
            WEBUI_WORKSPACE_ROOT: $(Build.SourcesDirectory)
            METADATA_INPUT_DIR: $(Pipeline.Workspace)/releaseBuild/release-metadata
            EXPECTED_VALIDATION_MODE: ${{ parameters.validationMode }}

        - download: releaseBuild
          artifact: unsigned_npm_packages
          displayName: Download unsigned npm packages

        - download: releaseBuild
          artifact: unsigned_crate_packages
          displayName: Download unsigned crate packages

        - download: releaseBuild
          artifact: nuget_signing_input
          displayName: Download NuGet signing input

        - download: releaseBuild
          artifact: standalone_release_assets
          displayName: Download standalone release assets

        - task: Bash@3
          displayName: Stage release artifacts
          inputs:
            targetType: inline
            script: '"$RELEASE_XTASK" release-stage-artifacts'
          env:
            RELEASE_XTASK: $(Pipeline.Workspace)/releaseBuild/release-tools/xtask
            WEBUI_WORKSPACE_ROOT: $(Build.SourcesDirectory)
            BUILD_SOURCES_DIRECTORY: $(Build.SourcesDirectory)
            PIPELINE_WORKSPACE: $(Pipeline.Workspace)

        - task: UseDotNet@2
          displayName: Install .NET 8 SDK for ESRP
          inputs:
            packageType: sdk
            version: 8.x

        - template: WebUI.Sign.PipelineTemplate.yml@webuiPipelines

        - ${{ if eq(parameters.validationMode, 'false') }}:
          - task: Bash@3
            displayName: Ensure release tag
            inputs:
              targetType: inline
              script: '"$RELEASE_XTASK" release-ensure-tag'
            env:
              RELEASE_XTASK: $(Pipeline.Workspace)/releaseBuild/release-tools/xtask
              WEBUI_WORKSPACE_ROOT: $(Build.SourcesDirectory)
              RELEASE_TAG: $(releaseTag)
              RELEASE_COMMIT: $(releaseCommit)

          - task: GitHubRelease@1
            displayName: Create or update GitHub Release
            inputs:
              gitHubConnection: fast
              repositoryName: microsoft/webui
              action: edit
              target: $(releaseCommit)
              tag: $(releaseTag)
              title: $(releaseTag)
              releaseNotesSource: inline
              releaseNotesInline: 'Automated WebUI release.'
              addChangeLog: false
              assets: |
                $(Build.SourcesDirectory)/publish_artifacts_npm/*
                $(Build.ArtifactStagingDirectory)/publish_artifacts_nuget/*
                $(Build.SourcesDirectory)/publish_artifacts_crates/*
                $(Build.SourcesDirectory)/publish_artifacts_standalone/*
              assetUploadMode: replace
              isDraft: false
              isPreRelease: false
              makeLatest: legacy

          - template: WebUI.Release.PipelineTemplate.yml@webuiPipelines
