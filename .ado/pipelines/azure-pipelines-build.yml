# Register this YAML in Azure DevOps with the exact pipeline definition name
# "Web UI - CD Build". .ado/pipelines/azure-pipelines-cd.yml references that definition name.
trigger:
  branches:
    include:
    - main
    - hotfix/*
pr: none

parameters:
- name: validationMode
  displayName: Rebuild an existing release for artifact validation
  type: string
  default: 'false'
  values:
  - 'false'
  - 'true'

stages:
- stage: PrepareRelease
  displayName: Prepare release
  jobs:
  - job: SelectRelease
    displayName: Select release
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      fetchDepth: 0
      fetchTags: true
    - task: Bash@3
      displayName: Resolve release version
      name: release
      inputs:
        targetType: inline
        script: |
          set -euo pipefail

          release_version=$(awk '
            $0 == "[workspace.package]" { in_workspace = 1; next }
            /^\[/ { in_workspace = 0 }
            in_workspace && /^version = "/ {
              value = $0
              sub(/^version = "/, "", value)
              sub(/"$/, "", value)
              print value
              exit
            }
          ' Cargo.toml)

          python_version="$release_version"
          stable_tag=
          if [[ "$release_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            expected_branch=refs/heads/main
          elif [[ "$release_version" =~ ^((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))-hotfix\.([1-9][0-9]*)$ ]]; then
            python_version="${BASH_REMATCH[1]}.post${BASH_REMATCH[5]}"
            expected_branch="refs/heads/hotfix/v${release_version}"
            stable_tag="v${BASH_REMATCH[1]}"
          else
            echo "##vso[task.logissue type=error]Cargo.toml must contain a stable or major.minor.patch-hotfix.number workspace version."
            exit 1
          fi

          if [[ "$ALLOW_EXISTING_RELEASE" != true ]] &&
            [[ "$BUILD_SOURCEBRANCH" != "$expected_branch" ]]; then
            echo "##vso[task.logissue type=error]Production release ${release_version} must run from ${expected_branch}. Use validationMode=true for other branches."
            exit 1
          fi

          release_commit="${BUILD_SOURCEVERSION:?BUILD_SOURCEVERSION is required}"
          if [[ -n "$stable_tag" ]]; then
            stable_ref="refs/tags/${stable_tag}^{commit}"
            if ! git rev-parse --verify "$stable_ref" >/dev/null; then
              echo "##vso[task.logissue type=error]Required base release tag ${stable_tag} does not exist."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$stable_ref" "$release_commit"; then
              echo "##vso[task.logissue type=error]Hotfix commit ${release_commit} is not descended from ${stable_tag}."
              exit 1
            fi
          fi
          release_tag="v${release_version}"
          release_tag="v${release_version}"
          if ! source_date_epoch=$(git show -s --format=%ct "$release_commit"); then
            echo "##vso[task.logissue type=error]Unable to read the commit timestamp for release commit ${release_commit}."
            exit 1
          fi
          if [[ ! "$source_date_epoch" =~ ^[1-9][0-9]*$ ]]; then
            echo "##vso[task.logissue type=error]Release commit ${release_commit} has an invalid commit timestamp."
            exit 1
          fi

          set +e
          git ls-remote --exit-code origin \
            "refs/tags/${release_tag}" "refs/tags/${release_tag}^{}" >/dev/null
          tag_status=$?
          set -e
          case "$tag_status" in
            0)
              if [[ "$ALLOW_EXISTING_RELEASE" == true ]]; then
                should_build=true
                echo "${release_tag} exists; rebuilding artifacts for validation."
              else
                should_build=false
                echo "${release_tag} exists; skipping release build."
              fi
              ;;
            2) should_build=true ;;
            *)
              echo "##vso[task.logissue type=error]Unable to query ${release_tag} from origin."
              exit 1
              ;;
          esac

          echo "##vso[build.updatebuildnumber]${release_tag}-build-${BUILD_BUILDID}"
          echo "##vso[task.setvariable variable=releaseVersion;isOutput=true]${release_version}"
          echo "##vso[task.setvariable variable=pythonVersion;isOutput=true]${python_version}"
          echo "##vso[task.setvariable variable=releaseTag;isOutput=true]${release_tag}"
          echo "##vso[task.setvariable variable=releaseCommit;isOutput=true]${release_commit}"
          echo "##vso[task.setvariable variable=sourceDateEpoch;isOutput=true]${source_date_epoch}"
          echo "##vso[task.setvariable variable=shouldBuild;isOutput=true]${should_build}"
      env:
        ALLOW_EXISTING_RELEASE: ${{ parameters.validationMode }}

- stage: ValidateHotfix
  displayName: Validate hotfix release line
  dependsOn: PrepareRelease
  condition: |
    and(
      succeeded(),
      eq(dependencies.PrepareRelease.outputs['SelectRelease.release.shouldBuild'], 'true'),
      startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/')
    )
  variables:
    CARGO_CACHE_HOME: $(Pipeline.Workspace)/.cargo
    PNPM_STORE_PATH: $(Pipeline.Workspace)/.pnpm-store
  jobs:
  - job: QualityGate
    displayName: Run full quality gate
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      clean: true
    - task: Cache@2
      displayName: Restore Cargo cache
      inputs:
        key: 'hotfix-validation-cargo-home | "$(Agent.OS)" | Cargo.lock'
        restoreKeys: |
          hotfix-validation-cargo-home | "$(Agent.OS)"
        path: $(CARGO_CACHE_HOME)
    - task: Cache@2
      displayName: Restore validation target cache
      inputs:
        key: 'hotfix-validation-target | "$(Agent.OS)" | Cargo.lock'
        restoreKeys: |
          hotfix-validation-target | "$(Agent.OS)"
        path: $(Build.SourcesDirectory)/target
    - task: Cache@2
      displayName: Restore pnpm store
      inputs:
        key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
        restoreKeys: |
          pnpm | "$(Agent.OS)"
        path: $(PNPM_STORE_PATH)
    - task: NodeTool@0
      displayName: Install Node.js 22
      inputs:
        versionSpec: 22.x
    - task: Bash@3
      displayName: Run cargo xtask check
      inputs:
        targetType: inline
        workingDirectory: '$(Build.SourcesDirectory)'
        script: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q protobuf-compiler
          rustup toolchain install 1.93 --profile minimal
          rustup default 1.93
          corepack enable
          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          cargo xtask check
      env:
        CARGO_HOME: $(CARGO_CACHE_HOME)
        PNPM_STORE_PATH: $(PNPM_STORE_PATH)

- stage: BuildArtifacts
  displayName: Build release artifacts
  dependsOn:
  - PrepareRelease
  - ValidateHotfix
  condition: |
    and(
      eq(dependencies.PrepareRelease.result, 'Succeeded'),
      in(dependencies.ValidateHotfix.result, 'Succeeded', 'Skipped'),
      eq(dependencies.PrepareRelease.outputs['SelectRelease.release.shouldBuild'], 'true')
    )
  variables:
    releaseTag: $[ stageDependencies.PrepareRelease.SelectRelease.outputs['release.releaseTag'] ]
    releaseCommit: $[ stageDependencies.PrepareRelease.SelectRelease.outputs['release.releaseCommit'] ]
    releaseVersion: $[ stageDependencies.PrepareRelease.SelectRelease.outputs['release.releaseVersion'] ]
    pythonVersion: $[ stageDependencies.PrepareRelease.SelectRelease.outputs['release.pythonVersion'] ]
    sourceDateEpoch: $[ stageDependencies.PrepareRelease.SelectRelease.outputs['release.sourceDateEpoch'] ]
    CARGO_CACHE_HOME: $(Pipeline.Workspace)/.cargo
    PNPM_STORE_PATH: $(Pipeline.Workspace)/.pnpm-store
  jobs:
  - job: BuildLinuxAssets
    displayName: Build Linux release asset
    strategy:
      matrix:
        LinuxX64:
          targetTriple: x86_64-unknown-linux-gnu
          artifactName: stage-linux-x64
          installArm64Linker: 'false'
          manylinuxCrossImage: messense/manylinux2014-cross:x86_64@sha256:13670ccc63c35e072661938181c046243c01d7bca7976b3914177fb9b162998d
          pythonNativeTest: 'true'
        LinuxArm64:
          targetTriple: aarch64-unknown-linux-gnu
          artifactName: stage-linux-arm64
          installArm64Linker: 'true'
          manylinuxCrossImage: messense/manylinux2014-cross:aarch64@sha256:32c92568ebee8db53e0598c21bcd06a6dd1649d45d507646a8a49313c50325f8
          pythonNativeTest: 'false'
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      clean: true
    - task: UsePythonVersion@0
      displayName: Use Python 3.11
      inputs:
        versionSpec: '3.11'
    - task: Cache@2
      displayName: Restore Cargo cache
      inputs:
        key: 'cargo-home | "$(Agent.OS)" | "$(targetTriple)" | Cargo.lock'
        restoreKeys: |
          cargo-home | "$(Agent.OS)" | "$(targetTriple)"
          cargo-home | "$(Agent.OS)"
        path: $(CARGO_CACHE_HOME)
    - task: Cache@2
      displayName: Restore target cache
      inputs:
        key: 'cargo-target | "$(Agent.OS)" | "$(targetTriple)" | Cargo.lock'
        restoreKeys: |
          cargo-target | "$(Agent.OS)" | "$(targetTriple)"
        path: $(Build.SourcesDirectory)/target
    - task: Bash@3
      displayName: Build and stage $(targetTriple)
      inputs:
        targetType: inline
        workingDirectory: '$(Build.SourcesDirectory)'
        script: |
          #!/usr/bin/env bash
          # Copyright (c) Microsoft Corporation.
          # Licensed under the MIT license.

          set -euo pipefail

          : "${BUILD_ARTIFACT_STAGING_DIRECTORY:?BUILD_ARTIFACT_STAGING_DIRECTORY is required}"
          : "${TARGET_TRIPLE:?TARGET_TRIPLE is required}"
          : "${ARTIFACT_NAME:?ARTIFACT_NAME is required}"

          sudo apt-get update -q
          sudo apt-get install -y -q protobuf-compiler
          if [[ "$INSTALL_ARM64_LINKER" == true ]]; then
            sudo apt-get install -y -q gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          rustup toolchain install 1.93 --profile minimal --target "$TARGET_TRIPLE"

          # Natives build on the host, but the wheel must link an old glibc, so
          # the container step below runs the same command with --python-only.
          CARGO_HOME="$CARGO_CACHE_HOME" cargo +1.93 xtask publish-build \
            --target "$TARGET_TRIPLE" \
            --profile release \
            --native-only \
            --output "$BUILD_ARTIFACT_STAGING_DIRECTORY/$ARTIFACT_NAME"
      env:
        ARTIFACT_NAME: $(artifactName)
        BUILD_ARTIFACT_STAGING_DIRECTORY: $(Build.ArtifactStagingDirectory)
        INSTALL_ARM64_LINKER: $(installArm64Linker)
        TARGET_TRIPLE: $(targetTriple)
    - task: Bash@3
      displayName: Build Python wheel ($(targetTriple))
      inputs:
        targetType: inline
        workingDirectory: '$(Build.SourcesDirectory)'
        script: |
          set -euo pipefail
          # Wheel build policy lives in xtask (publish-python); this only
          # supplies the pinned old-glibc environment it must run inside.
          docker run --rm --platform linux/amd64 \
            -e SOURCE_DATE_EPOCH \
            -v "$(pwd)":/io \
            -v "${BUILD_ARTIFACT_STAGING_DIRECTORY}:/out" \
            -w /io "$MANYLINUX_CROSS_IMAGE" \
            bash crates/webui-python/scripts/build-manylinux-wheel.sh \
              "$TARGET_TRIPLE" "/out/$ARTIFACT_NAME"
      env:
        ARTIFACT_NAME: $(artifactName)
        BUILD_ARTIFACT_STAGING_DIRECTORY: $(Build.ArtifactStagingDirectory)
        MANYLINUX_CROSS_IMAGE: $(manylinuxCrossImage)
        SOURCE_DATE_EPOCH: $(sourceDateEpoch)
        TARGET_TRIPLE: $(targetTriple)
    - task: PublishPipelineArtifact@1
      displayName: Upload $(targetTriple) artifact
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/$(artifactName)'
        artifactName: $(artifactName)

  - job: BuildMacOSAssets
    displayName: Build macOS release asset
    strategy:
      matrix:
        MacOSArm64:
          targetTriple: aarch64-apple-darwin
          artifactName: stage-macos-arm64
          pythonNativeTest: 'false'
        MacOSX64:
          targetTriple: x86_64-apple-darwin
          artifactName: stage-macos-x64
          pythonNativeTest: 'true'
    pool:
      vmImage: macOS-latest
    steps:
    - checkout: self
      clean: true
    - task: UsePythonVersion@0
      displayName: Use Python 3.11
      inputs:
        versionSpec: '3.11'
    - task: Cache@2
      displayName: Restore Cargo cache
      inputs:
        key: 'cargo-home | "$(Agent.OS)" | "$(targetTriple)" | Cargo.lock'
        restoreKeys: |
          cargo-home | "$(Agent.OS)" | "$(targetTriple)"
          cargo-home | "$(Agent.OS)"
        path: $(CARGO_CACHE_HOME)
    - task: Cache@2
      displayName: Restore target cache
      inputs:
        key: 'cargo-target | "$(Agent.OS)" | "$(targetTriple)" | Cargo.lock'
        restoreKeys: |
          cargo-target | "$(Agent.OS)" | "$(targetTriple)"
        path: $(Build.SourcesDirectory)/target
    - task: Bash@3
      displayName: Build and stage $(targetTriple)
      inputs:
        targetType: inline
        workingDirectory: '$(Build.SourcesDirectory)'
        script: |
          #!/usr/bin/env bash
          # Copyright (c) Microsoft Corporation.
          # Licensed under the MIT license.

          set -euo pipefail

          : "${BUILD_ARTIFACT_STAGING_DIRECTORY:?BUILD_ARTIFACT_STAGING_DIRECTORY is required}"
          : "${TARGET_TRIPLE:?TARGET_TRIPLE is required}"
          : "${ARTIFACT_NAME:?ARTIFACT_NAME is required}"

          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi
          rustup toolchain install 1.93 --profile minimal --target "$TARGET_TRIPLE"
          python3.11 -m pip install --upgrade "maturin==1.14.1"

          CARGO_HOME="$CARGO_CACHE_HOME" cargo +1.93 xtask publish-build \
            --target "$TARGET_TRIPLE" \
            --profile release \
            --output "$BUILD_ARTIFACT_STAGING_DIRECTORY/$ARTIFACT_NAME"
      env:
        ARTIFACT_NAME: $(artifactName)
        BUILD_ARTIFACT_STAGING_DIRECTORY: $(Build.ArtifactStagingDirectory)
        TARGET_TRIPLE: $(targetTriple)
    - task: PublishPipelineArtifact@1
      displayName: Upload $(targetTriple) artifact
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/$(artifactName)'
        artifactName: $(artifactName)

  - job: BuildWindowsAssets
    displayName: Build Windows release asset
    strategy:
      matrix:
        WindowsX64:
          targetTriple: x86_64-pc-windows-msvc
          artifactName: stage-windows-x64
          pythonNativeTest: 'true'
        WindowsArm64:
          targetTriple: aarch64-pc-windows-msvc
          artifactName: stage-windows-arm64
          pythonNativeTest: 'false'
    pool:
      vmImage: windows-latest
    steps:
    - checkout: self
      clean: true
    - task: UsePythonVersion@0
      displayName: Use Python 3.11
      inputs:
        versionSpec: '3.11'
    - task: Cache@2
      displayName: Restore Cargo cache
      inputs:
        key: 'cargo-home | "$(Agent.OS)" | "$(targetTriple)" | Cargo.lock'
        restoreKeys: |
          cargo-home | "$(Agent.OS)" | "$(targetTriple)"
          cargo-home | "$(Agent.OS)"
        path: $(CARGO_CACHE_HOME)
    - task: Cache@2
      displayName: Restore target cache
      inputs:
        key: 'cargo-target | "$(Agent.OS)" | "$(targetTriple)" | Cargo.lock'
        restoreKeys: |
          cargo-target | "$(Agent.OS)" | "$(targetTriple)"
        path: $(Build.SourcesDirectory)/target
    - task: PowerShell@2
      displayName: Build and stage $(targetTriple)
      inputs:
        targetType: inline
        pwsh: true
        workingDirectory: '$(Build.SourcesDirectory)'
        script: |
          # Copyright (c) Microsoft Corporation.
          # Licensed under the MIT license.

          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          if (-not $env:BUILD_ARTIFACT_STAGING_DIRECTORY) {
              throw 'BUILD_ARTIFACT_STAGING_DIRECTORY is required.'
          }
          if (-not $env:TARGET_TRIPLE) {
              throw 'TARGET_TRIPLE is required.'
          }
          if (-not $env:ARTIFACT_NAME) {
              throw 'ARTIFACT_NAME is required.'
          }

          if (-not (Get-Command protoc -ErrorAction SilentlyContinue)) {
              $version = '29.5'
              $expectedSha256 = '633d3e555fc97f0a1f55b4adb03256cd94b8059e51e7abbae98ff39e58a9dfa5'
              $zip = "$env:AGENT_TEMP_DIRECTORY\protoc.zip"
              $dest = "$env:AGENT_TEMP_DIRECTORY\protoc"
              Invoke-WebRequest `
                  -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-win64.zip" `
                  -OutFile $zip
              $actualSha256 = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
              if (-not $actualSha256.Equals($expectedSha256, [System.StringComparison]::OrdinalIgnoreCase)) {
                  Remove-Item $zip -Force
                  throw "protoc archive SHA-256 mismatch: expected $expectedSha256, received $actualSha256."
              }
              Expand-Archive -Path $zip -DestinationPath $dest -Force
              $env:PATH = "$dest\bin;$env:PATH"
          }

          rustup toolchain install 1.93 --profile minimal --target $env:TARGET_TRIPLE
          python -m pip install --upgrade "maturin==1.14.1"

          $env:CARGO_HOME = $env:CARGO_CACHE_HOME
          cargo +1.93 xtask publish-build `
              --target $env:TARGET_TRIPLE `
              --profile release `
              --output "$env:BUILD_ARTIFACT_STAGING_DIRECTORY\$env:ARTIFACT_NAME"
      env:
        AGENT_TEMP_DIRECTORY: $(Agent.TempDirectory)
        ARTIFACT_NAME: $(artifactName)
        BUILD_ARTIFACT_STAGING_DIRECTORY: $(Build.ArtifactStagingDirectory)
        TARGET_TRIPLE: $(targetTriple)
    - task: PublishPipelineArtifact@1
      displayName: Upload $(targetTriple) artifact
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/$(artifactName)'
        artifactName: $(artifactName)

  # Microsoft-hosted pools have no ARM64 Linux or Windows vmImage, and
  # macOS-latest is Intel x64, so the ARM64 wheels built above can only be
  # cross-compiled on those hosted pools, never genuinely executed there.
  # Each of the following three jobs is a compile-time template conditional:
  # if the matching pool parameter is set, it downloads the pre-built wheel
  # and smoke-tests it on real matching hardware; otherwise it hard-fails
  # with actionable guidance instead of silently skipping the test or
  # claiming the wheel was validated when it was not.
  # The configured self-hosted pool's agent must already have a Python 3.11
  # interpreter on PATH (as `python3.11` on Linux/macOS, `python` on
  # Windows) - UsePythonVersion@0 is not used here because its tool cache
  # is not guaranteed to be provisioned on arbitrary self-hosted agents.
  - job: AssembleRelease
    displayName: Assemble release packages
    dependsOn:
    - BuildLinuxAssets
    - BuildMacOSAssets
    - BuildWindowsAssets
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      clean: true
    - task: Cache@2
      displayName: Restore Cargo cache
      inputs:
        key: 'cargo-home | "$(Agent.OS)" | Cargo.lock'
        restoreKeys: |
          cargo-home | "$(Agent.OS)"
        path: $(CARGO_CACHE_HOME)
    - task: Cache@2
      displayName: Restore assembly target cache
      inputs:
        key: 'cargo-target | "$(Agent.OS)" | assembly-release | Cargo.lock'
        restoreKeys: |
          cargo-target | "$(Agent.OS)" | assembly-release
        path: $(Build.SourcesDirectory)/target
    - task: Cache@2
      displayName: Restore pnpm store
      inputs:
        key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
        restoreKeys: |
          pnpm | "$(Agent.OS)"
        path: $(PNPM_STORE_PATH)
    - task: DownloadPipelineArtifact@2
      displayName: Download Linux x64 release asset
      inputs:
        buildType: current
        artifactName: stage-linux-x64
        targetPath: $(Build.SourcesDirectory)
    - task: DownloadPipelineArtifact@2
      displayName: Download Linux arm64 release asset
      inputs:
        buildType: current
        artifactName: stage-linux-arm64
        targetPath: $(Build.SourcesDirectory)
    - task: DownloadPipelineArtifact@2
      displayName: Download macOS arm64 release asset
      inputs:
        buildType: current
        artifactName: stage-macos-arm64
        targetPath: $(Build.SourcesDirectory)
    - task: DownloadPipelineArtifact@2
      displayName: Download macOS x64 release asset
      inputs:
        buildType: current
        artifactName: stage-macos-x64
        targetPath: $(Build.SourcesDirectory)
    - task: DownloadPipelineArtifact@2
      displayName: Download Windows x64 release asset
      inputs:
        buildType: current
        artifactName: stage-windows-x64
        targetPath: $(Build.SourcesDirectory)
    - task: DownloadPipelineArtifact@2
      displayName: Download Windows arm64 release asset
      inputs:
        buildType: current
        artifactName: stage-windows-arm64
        targetPath: $(Build.SourcesDirectory)
    - task: NodeTool@0
      displayName: Install Node.js 22
      inputs:
        versionSpec: 22.x
    - task: UseDotNet@2
      displayName: Install .NET 9 SDK
      inputs:
        packageType: sdk
        version: 9.x
    - task: UsePythonVersion@0
      displayName: Use Python 3.11
      inputs:
        versionSpec: '3.11'
    - task: Bash@3
      displayName: Generate release artifacts
      inputs:
        targetType: inline
        workingDirectory: '$(Build.SourcesDirectory)'
        script: |
          set -euo pipefail
          : "${RELEASE_VERSION:?RELEASE_VERSION is required}"
          : "${PYTHON_VERSION:?PYTHON_VERSION is required}"
          : "${SOURCE_DATE_EPOCH:?SOURCE_DATE_EPOCH is required}"
          sudo apt-get update -q
          sudo apt-get install -y -q protobuf-compiler
          rustup toolchain install 1.93 --profile minimal
          corepack enable
          pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_PATH"
          # Needed for the `cargo xtask publish-stage --pack-only` sdist step
          # below; the six pre-built wheels were already downloaded above.
          python3.11 -m pip install --upgrade "maturin==1.14.1"
          # Versioned package archives are outputs, not reusable compilation artifacts.
          rm -rf target/package
          trap 'rm -rf target/package' EXIT
          CARGO_HOME="$CARGO_CACHE_HOME" cargo +1.93 xtask publish-stage --pack-only --profile release
          python crates/webui-python/tests/validate_artifacts.py \
            "publish/python/microsoft_webui-${PYTHON_VERSION}-cp311-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" \
            "publish/python/microsoft_webui-${PYTHON_VERSION}-cp311-abi3-manylinux_2_17_aarch64.manylinux2014_aarch64.whl" \
            "publish/python/microsoft_webui-${PYTHON_VERSION}-cp311-abi3-win_amd64.whl" \
            "publish/python/microsoft_webui-${PYTHON_VERSION}-cp311-abi3-win_arm64.whl" \
            "publish/python/microsoft_webui-${PYTHON_VERSION}-cp311-abi3-macosx_10_12_x86_64.whl" \
            "publish/python/microsoft_webui-${PYTHON_VERSION}-cp311-abi3-macosx_11_0_arm64.whl" \
            "publish/python/microsoft_webui-${PYTHON_VERSION}.tar.gz"
      env:
        PNPM_STORE_PATH: $(PNPM_STORE_PATH)
        RELEASE_VERSION: $(releaseVersion)
        PYTHON_VERSION: $(pythonVersion)
        SOURCE_DATE_EPOCH: $(sourceDateEpoch)
    - task: Bash@3
      displayName: Write release metadata
      inputs:
        targetType: inline
        script: |
          set -euo pipefail
          mkdir -p "$METADATA_OUTPUT_DIR"
          printf '%s\n' "$RELEASE_TAG" > "$METADATA_OUTPUT_DIR/release-tag.txt"
          printf '%s\n' "$RELEASE_COMMIT" > "$METADATA_OUTPUT_DIR/release-commit.txt"
          printf '%s\n' "$RELEASE_VERSION" > "$METADATA_OUTPUT_DIR/release-version.txt"
          printf '%s\n' "$VALIDATION_MODE" > "$METADATA_OUTPUT_DIR/validation-mode.txt"
      env:
        METADATA_OUTPUT_DIR: $(Build.ArtifactStagingDirectory)/release-metadata
        RELEASE_TAG: $(releaseTag)
        RELEASE_COMMIT: $(releaseCommit)
        RELEASE_VERSION: $(releaseVersion)
        VALIDATION_MODE: ${{ parameters.validationMode }}
    - task: PublishPipelineArtifact@1
      displayName: Upload unsigned npm packages
      inputs:
        targetPath: '$(Build.SourcesDirectory)/publish/npm'
        artifactName: unsigned_npm_packages
    - task: PublishPipelineArtifact@1
      displayName: Upload unsigned crate packages
      inputs:
        targetPath: '$(Build.SourcesDirectory)/publish/crates'
        artifactName: unsigned_crate_packages
    - task: PublishPipelineArtifact@1
      displayName: Upload unsigned Python packages
      inputs:
        targetPath: '$(Build.SourcesDirectory)/publish/python'
        artifactName: unsigned_python_packages
    - task: PublishPipelineArtifact@1
      displayName: Upload NuGet signing input
      inputs:
        targetPath: '$(Build.SourcesDirectory)/publish/nuget'
