# Register this YAML in Azure DevOps with the exact pipeline definition name "Web UI - CD".
trigger: none
pr: none

parameters:
- name: validationMode
  displayName: Generate signed artifacts without external publication
  type: string
  default: 'false'
  values:
  - 'false'
  - 'true'

resources:
  pipelines:
  - pipeline: releaseBuild
    source: Web UI - CD Build
    # Manual Run Pipeline selection may intentionally override this default.
    branch: refs/heads/main
    trigger:
      branches:
        include:
        - main
      stages:
      - BuildArtifacts
  repositories:
  - repository: webuiPipelines
    type: git
    name: open-source/WebUIPipelineTemplates
    ref: main
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  # The pipeline extends the 1ES PT, which injects SDL and compliance tasks.
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: OneESPool
      image: HostedPoolLinuxImage
      os: linux
    sdl:
      sourceAnalysisPool:
        name: OneESPool
        image: HostedPoolWindowsImage
        os: windows
    settings:
      networkIsolationPolicy: Permissive
    stages:
    - stage: SignArtifacts
      displayName: Sign release artifacts
      jobs:
      - job: Sign
        displayName: Sign release artifacts
        templateContext:
          outputs:
          - output: pipelineArtifact
            targetPath: '$(Build.SourcesDirectory)/publish_artifacts_npm'
            artifactName: unsigned_npm_packages
            displayName: Publish unsigned npm packages
          - output: pipelineArtifact
            targetPath: '$(Build.SourcesDirectory)/publish_artifacts_crates'
            artifactName: unsigned_crate_packages
            displayName: Publish unsigned crate packages
          - output: pipelineArtifact
            targetPath: '$(Build.SourcesDirectory)/publish_artifacts_python'
            artifactName: unsigned_python_packages
            displayName: Publish unsigned Python packages
          - output: pipelineArtifact
            targetPath: '$(Build.ArtifactStagingDirectory)/publish_artifacts_nuget'
            artifactName: signed_nuget_packages
            displayName: Publish signed NuGet packages
          - output: pipelineArtifact
            targetPath: '$(Build.SourcesDirectory)/publish_artifacts_standalone'
            artifactName: standalone_release_assets
            displayName: Publish standalone release assets
        steps:
        - checkout: self
          clean: true

        - download: releaseBuild
          artifact: release-metadata
          displayName: Download release metadata

        - task: Bash@3
          name: release
          displayName: Read release metadata
          inputs:
            targetType: inline
            script: |
              set -euo pipefail
              metadata_dir="${METADATA_INPUT_DIR:?METADATA_INPUT_DIR is required}"
              release_tag=$(<"$metadata_dir/release-tag.txt")
              release_commit=$(<"$metadata_dir/release-commit.txt")
              release_version=$(<"$metadata_dir/release-version.txt")
              validation_mode=$(<"$metadata_dir/validation-mode.txt")

              if [[ "$EXPECTED_VALIDATION_MODE" != true ]] &&
                [[ "$RELEASE_SOURCE_BRANCH" != refs/heads/main ]]; then
                echo "##vso[task.logissue type=error]Production releases require a release build from refs/heads/main."
                exit 1
              fi

              if [[ "$release_tag" != "v${release_version}" ]] ||
                [[ ! "$release_commit" =~ ^[0-9a-f]{40}$ ]] ||
                [[ "$validation_mode" != "$EXPECTED_VALIDATION_MODE" ]]; then
                echo "##vso[task.logissue type=error]Release metadata is invalid or does not match validation mode."
                exit 1
              fi

              echo "##vso[build.updatebuildnumber]${release_tag}-cd-${BUILD_BUILDID}"
              echo "##vso[task.setvariable variable=releaseVersion;isOutput=true]${release_version}"
              echo "##vso[task.setvariable variable=releaseTag;isOutput=true]${release_tag}"
              echo "##vso[task.setvariable variable=releaseCommit;isOutput=true]${release_commit}"
          env:
            METADATA_INPUT_DIR: $(Pipeline.Workspace)/releaseBuild/release-metadata
            EXPECTED_VALIDATION_MODE: ${{ parameters.validationMode }}
            RELEASE_SOURCE_BRANCH: $(resources.pipeline.releaseBuild.sourceBranch)

        - download: releaseBuild
          artifact: unsigned_npm_packages
          displayName: Download unsigned npm packages

        - download: releaseBuild
          artifact: unsigned_crate_packages
          displayName: Download unsigned crate packages

        - download: releaseBuild
          artifact: unsigned_python_packages
          displayName: Download unsigned Python packages

        - download: releaseBuild
          artifact: nuget_signing_input
          displayName: Download NuGet signing input

        - download: releaseBuild
          artifact: standalone_release_assets
          displayName: Download standalone release assets

        - task: CopyFiles@2
          displayName: Stage npm packages
          inputs:
            SourceFolder: $(Pipeline.Workspace)/releaseBuild/unsigned_npm_packages
            Contents: '**'
            TargetFolder: $(Build.SourcesDirectory)/publish_artifacts_npm
            CleanTargetFolder: true

        - task: CopyFiles@2
          displayName: Stage crate packages
          inputs:
            SourceFolder: $(Pipeline.Workspace)/releaseBuild/unsigned_crate_packages
            Contents: '**'
            TargetFolder: $(Build.SourcesDirectory)/publish_artifacts_crates
            CleanTargetFolder: true

        - task: CopyFiles@2
          displayName: Stage Python packages
          inputs:
            SourceFolder: $(Pipeline.Workspace)/releaseBuild/unsigned_python_packages
            Contents: '**'
            TargetFolder: $(Build.SourcesDirectory)/publish_artifacts_python
            CleanTargetFolder: true

        - task: CopyFiles@2
          displayName: Stage NuGet packages
          inputs:
            SourceFolder: $(Pipeline.Workspace)/releaseBuild/nuget_signing_input
            Contents: '**'
            TargetFolder: $(Build.SourcesDirectory)/publish_artifacts_nuget
            CleanTargetFolder: true

        - task: CopyFiles@2
          displayName: Stage standalone release assets
          inputs:
            SourceFolder: $(Pipeline.Workspace)/releaseBuild/standalone_release_assets
            Contents: '**'
            TargetFolder: $(Build.SourcesDirectory)/publish_artifacts_standalone
            CleanTargetFolder: true

        - task: UseDotNet@2
          displayName: Install .NET 8 SDK for ESRP
          inputs:
            packageType: sdk
            version: 8.x

        - template: WebUI.Sign.PipelineTemplate.yml@webuiPipelines

    - ${{ if eq(parameters.validationMode, 'false') }}:
      - stage: TagRelease
        displayName: Tag release
        dependsOn: SignArtifacts
        variables:
          releaseTag: $[ stageDependencies.SignArtifacts.Sign.outputs['release.releaseTag'] ]
          releaseCommit: $[ stageDependencies.SignArtifacts.Sign.outputs['release.releaseCommit'] ]
        jobs:
        - job: Tag
          displayName: Create release tag
          steps:
          - checkout: self
            clean: true
            fetchDepth: 0
            persistCredentials: true

          - task: Bash@3
            displayName: Create annotated release tag
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                remote_ref="refs/azure-release-tags/${RELEASE_TAG}"

                git fetch --no-tags origin "$RELEASE_COMMIT"
                if git fetch --force origin "refs/tags/${RELEASE_TAG}:${remote_ref}" 2>/dev/null; then
                  existing_commit=$(git rev-parse "${remote_ref}^{}")
                  if [[ "$existing_commit" != "$RELEASE_COMMIT" ]]; then
                    echo "##vso[task.logissue type=error]${RELEASE_TAG} points to ${existing_commit}, not ${RELEASE_COMMIT}."
                    exit 1
                  fi
                  echo "${RELEASE_TAG} already points to ${RELEASE_COMMIT}."
                  exit 0
                fi

                git config user.name "Azure Pipelines"
                git config user.email "azure-pipelines@microsoft.com"
                git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "Release ${RELEASE_TAG}"
                if git push origin "refs/tags/${RELEASE_TAG}"; then
                  exit 0
                fi

                git fetch --force origin "refs/tags/${RELEASE_TAG}:${remote_ref}"
                raced_commit=$(git rev-parse "${remote_ref}^{}")
                if [[ "$raced_commit" != "$RELEASE_COMMIT" ]]; then
                  echo "##vso[task.logissue type=error]Concurrent tag ${RELEASE_TAG} points to ${raced_commit}, not ${RELEASE_COMMIT}."
                  exit 1
                fi
                echo "Concurrent release run created ${RELEASE_TAG} at the expected commit."
            env:
              RELEASE_TAG: $(releaseTag)
              RELEASE_COMMIT: $(releaseCommit)

      - stage: PublishRelease
        displayName: Publish GitHub and registry release
        dependsOn:
        - SignArtifacts
        - TagRelease
        variables:
          releaseTag: $[ stageDependencies.SignArtifacts.Sign.outputs['release.releaseTag'] ]
          releaseCommit: $[ stageDependencies.SignArtifacts.Sign.outputs['release.releaseCommit'] ]
        jobs:
        - job: PublishGitHub
          displayName: Publish GitHub Release
          # PyPI publication is triggered by the GitHub Release "published"
          # event (see .github/workflows/publish-pypi.yml). Publish npm and the
          # Rust crates first so every package ecosystem exposes the release in
          # lockstep; the Python sdist bundles its WebUI Rust source closure.
          dependsOn:
          - PublishNpm
          - PublishCrates
          steps:
          - checkout: self
            clean: true

          - task: DownloadPipelineArtifact@2
            displayName: Download npm packages
            inputs:
              buildType: current
              artifactName: unsigned_npm_packages
              targetPath: $(Build.SourcesDirectory)/publish_artifacts_npm

          - task: DownloadPipelineArtifact@2
            displayName: Download crate packages
            inputs:
              buildType: current
              artifactName: unsigned_crate_packages
              targetPath: $(Build.SourcesDirectory)/publish_artifacts_crates

          - task: DownloadPipelineArtifact@2
            displayName: Download Python packages
            inputs:
              buildType: current
              artifactName: unsigned_python_packages
              targetPath: $(Build.SourcesDirectory)/publish_artifacts_python

          - task: DownloadPipelineArtifact@2
            displayName: Download signed NuGet packages
            inputs:
              buildType: current
              artifactName: signed_nuget_packages
              targetPath: $(Build.ArtifactStagingDirectory)/publish_artifacts_nuget

          - task: DownloadPipelineArtifact@2
            displayName: Download standalone release assets
            inputs:
              buildType: current
              artifactName: standalone_release_assets
              targetPath: $(Build.SourcesDirectory)/publish_artifacts_standalone

          - task: Bash@3
            displayName: Create trusted Python release provenance
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                python3 - <<'PY'
                import hashlib
                import json
                import os
                import re
                from pathlib import Path

                repository = "microsoft/webui"
                release_actor = "azure-pipelines[bot]"
                release_tag = os.environ["RELEASE_TAG"]
                release_commit = os.environ["RELEASE_COMMIT"]
                version = release_tag[1:]
                artifact_dir = Path(os.environ["PYTHON_ARTIFACT_DIR"])

                def sha256_file(path):
                    digest = hashlib.sha256()
                    with path.open("rb") as stream:
                        for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                            digest.update(chunk)
                    return f"sha256:{digest.hexdigest()}"

                if os.environ["CD_PIPELINE_NAME"] != "Web UI - CD":
                    raise SystemExit("CD must run from the 'Web UI - CD' pipeline definition")
                if os.environ["RELEASE_BUILD_PIPELINE_NAME"] != "Web UI - CD Build":
                    raise SystemExit("release artifacts must come from 'Web UI - CD Build'")
                if os.environ["RELEASE_BUILD_SOURCE_BRANCH"] != "refs/heads/main":
                    raise SystemExit("release artifacts must come from refs/heads/main")
                if os.environ["RELEASE_BUILD_SOURCE_COMMIT"] != release_commit:
                    raise SystemExit("release artifact source commit does not match release metadata")
                if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?", release_tag):
                    raise SystemExit(f"invalid release tag: {release_tag}")
                if not re.fullmatch(r"[0-9a-f]{40}", release_commit):
                    raise SystemExit(f"invalid release commit: {release_commit}")

                build_id = os.environ["CD_BUILD_ID"]
                source_run_id = os.environ["RELEASE_BUILD_RUN_ID"]
                if not build_id.isdecimal() or not source_run_id.isdecimal():
                    raise SystemExit("Azure Pipeline run identifiers must be decimal integers")

                wheel_tags = (
                    "cp311-abi3-manylinux_2_17_x86_64.manylinux2014_x86_64",
                    "cp311-abi3-manylinux_2_17_aarch64.manylinux2014_aarch64",
                    "cp311-abi3-win_amd64",
                    "cp311-abi3-win_arm64",
                    "cp311-abi3-macosx_10_12_x86_64",
                    "cp311-abi3-macosx_11_0_arm64",
                )
                expected_names = {
                    *(f"microsoft_webui-{version}-{tag}.whl" for tag in wheel_tags),
                    f"microsoft_webui-{version}.tar.gz",
                }
                artifact_paths = sorted(
                    (*artifact_dir.glob("microsoft_webui-*.whl"),
                     *artifact_dir.glob("microsoft_webui-*.tar.gz")),
                    key=lambda path: path.name,
                )
                actual_names = {path.name for path in artifact_paths}
                if len(artifact_paths) != 7 or actual_names != expected_names:
                    missing = sorted(expected_names - actual_names)
                    unexpected = sorted(actual_names - expected_names)
                    raise SystemExit(
                        "expected exactly the six release wheels and one sdist; "
                        f"missing={missing}, unexpected={unexpected}"
                    )

                artifacts = []
                for path in artifact_paths:
                    size = path.stat().st_size
                    if size <= 0:
                        raise SystemExit(f"release artifact is empty: {path.name}")
                    artifacts.append({
                        "name": path.name,
                        "sha256": sha256_file(path),
                        "size": size,
                    })

                provenance = {
                    "schema": "microsoft.webui.python-release/v1",
                    "repository": repository,
                    "tag": release_tag,
                    "commit": release_commit,
                    "producer": {
                        "identity": release_actor,
                        "pipeline": os.environ["CD_PIPELINE_NAME"],
                        "build_id": build_id,
                        "source_pipeline": os.environ["RELEASE_BUILD_PIPELINE_NAME"],
                        "source_run_id": source_run_id,
                        "source_branch": os.environ["RELEASE_BUILD_SOURCE_BRANCH"],
                    },
                    "artifacts": artifacts,
                }
                manifest = artifact_dir / "webui-python-release-provenance.json"
                manifest.write_text(
                    json.dumps(provenance, sort_keys=True, separators=(",", ":")) + "\n",
                    encoding="utf-8",
                )
                print(f"Wrote trusted provenance for {len(artifacts)} Python release artifacts.")
                PY
            env:
              RELEASE_TAG: $(releaseTag)
              RELEASE_COMMIT: $(releaseCommit)
              PYTHON_ARTIFACT_DIR: $(Build.SourcesDirectory)/publish_artifacts_python
              CD_PIPELINE_NAME: $(Build.DefinitionName)
              CD_BUILD_ID: $(Build.BuildId)
              RELEASE_BUILD_PIPELINE_NAME: $(resources.pipeline.releaseBuild.pipelineName)
              RELEASE_BUILD_RUN_ID: $(resources.pipeline.releaseBuild.runID)
              RELEASE_BUILD_SOURCE_BRANCH: $(resources.pipeline.releaseBuild.sourceBranch)
              RELEASE_BUILD_SOURCE_COMMIT: $(resources.pipeline.releaseBuild.sourceCommit)

          - task: GitHubRelease@1
            displayName: Create draft GitHub Release and upload assets
            inputs:
              gitHubConnection: fast
              repositoryName: microsoft/webui
              action: create
              target: $(releaseCommit)
              tagSource: userSpecifiedTag
              tag: $(releaseTag)
              title: $(releaseTag)
              releaseNotesSource: inline
              releaseNotesInline: ''
              addChangeLog: true
              changeLogCompareToRelease: lastFullRelease
              changeLogType: issueBased
              assets: |
                $(Build.SourcesDirectory)/publish_artifacts_npm/*
                $(Build.ArtifactStagingDirectory)/publish_artifacts_nuget/*
                $(Build.SourcesDirectory)/publish_artifacts_crates/*
                $(Build.SourcesDirectory)/publish_artifacts_python/*
                $(Build.SourcesDirectory)/publish_artifacts_standalone/*
              assetUploadMode: replace
              # GitHub creates a release before GitHubRelease@1 uploads its
              # assets. Keep it draft so release.published cannot race uploads.
              isDraft: true
              isPreRelease: false
              makeLatest: legacy

          - task: Bash@3
            displayName: Prepare asset-free release finalization
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                if [[ -e "$NO_ASSET_PATH" || -L "$NO_ASSET_PATH" ]]; then
                  echo "##vso[task.logissue type=error]Reserved finalization path unexpectedly exists: $NO_ASSET_PATH"
                  exit 1
                fi
            env:
              NO_ASSET_PATH: $(Build.SourcesDirectory)/.release-finalize-without-assets

          - task: GitHubRelease@1
            displayName: Publish complete GitHub Release
            inputs:
              gitHubConnection: fast
              repositoryName: microsoft/webui
              action: edit
              target: $(releaseCommit)
              tag: $(releaseTag)
              title: $(releaseTag)
              releaseNotesSource: inline
              releaseNotesInline: ''
              addChangeLog: true
              changeLogCompareToRelease: lastFullRelease
              changeLogType: issueBased
              # `replace` is required: edit mode's default `delete` removes all
              # existing assets. This guaranteed-missing path makes the edit
              # publish the already-complete draft without another upload.
              assets: $(Build.SourcesDirectory)/.release-finalize-without-assets
              assetUploadMode: replace
              isDraft: false
              isPreRelease: false
              makeLatest: legacy

        - job: PublishNpm
          displayName: Publish npm packages
          steps:
          - checkout: self
            clean: true

          - task: DownloadPipelineArtifact@2
            displayName: Download npm packages
            inputs:
              buildType: current
              artifactName: unsigned_npm_packages
              targetPath: $(Build.SourcesDirectory)/publish_artifacts_npm

          # The template skips package types whose artifact directory is absent.
          - template: WebUI.Release.PipelineTemplate.yml@webuiPipelines

        - job: PublishCrates
          displayName: Publish Rust crates
          steps:
          - checkout: self
            clean: true

          - task: DownloadPipelineArtifact@2
            displayName: Download crate packages
            inputs:
              buildType: current
              artifactName: unsigned_crate_packages
              targetPath: $(Build.SourcesDirectory)/publish_artifacts_crates

          # The template skips package types whose artifact directory is absent.
          - template: WebUI.Release.PipelineTemplate.yml@webuiPipelines
