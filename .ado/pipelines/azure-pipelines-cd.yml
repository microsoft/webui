# Register this YAML in Azure DevOps with the exact pipeline definition name "Web UI - CD".
trigger: none
pr: none

parameters:
- name: validationMode
  displayName: Generate signed artifacts without external publication
  type: string
  default: 'false'
  values:
  - 'false'
  - 'true'

resources:
  pipelines:
  - pipeline: releaseBuild
    source: Web UI - CD Build
    # Manual Run Pipeline selection may intentionally override this default.
    branch: refs/heads/main
    trigger:
      branches:
        include:
        - main
      stages:
      - BuildArtifacts
  repositories:
  - repository: webuiPipelines
    type: git
    name: open-source/WebUIPipelineTemplates
    ref: main
  - repository: 1esPipelines
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release

extends:
  # The pipeline extends the 1ES PT, which injects SDL and compliance tasks.
  template: v1/1ES.Official.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      name: OneESPool
      image: HostedPoolLinuxImage
      os: linux
    sdl:
      sourceAnalysisPool:
        name: OneESPool
        image: HostedPoolWindowsImage
        os: windows
    settings:
      networkIsolationPolicy: Permissive
    stages:
    - stage: SignArtifacts
      displayName: Sign release artifacts
      jobs:
      - job: Sign
        displayName: Sign release artifacts
        templateContext:
          outputs:
          - output: pipelineArtifact
            targetPath: '$(Build.SourcesDirectory)/publish_artifacts_npm'
            artifactName: unsigned_npm_packages
            displayName: Publish unsigned npm packages
          - output: pipelineArtifact
            targetPath: '$(Build.SourcesDirectory)/publish_artifacts_crates'
            artifactName: unsigned_crate_packages
            displayName: Publish unsigned crate packages
          - output: pipelineArtifact
            targetPath: '$(Build.SourcesDirectory)/publish_artifacts_python'
            artifactName: unsigned_python_packages
            displayName: Publish unsigned Python packages
          - output: pipelineArtifact
            targetPath: '$(Build.ArtifactStagingDirectory)/publish_artifacts_nuget'
            artifactName: signed_nuget_packages
            displayName: Publish signed NuGet packages
          - output: pipelineArtifact
            targetPath: '$(Build.SourcesDirectory)/publish_artifacts_standalone'
            artifactName: standalone_release_assets
            displayName: Publish standalone release assets
        steps:
        - checkout: self
          clean: true

        - download: releaseBuild
          artifact: release-metadata
          displayName: Download release metadata

        - task: Bash@3
          name: release
          displayName: Read release metadata
          inputs:
            targetType: inline
            script: |
              set -euo pipefail
              metadata_dir="${METADATA_INPUT_DIR:?METADATA_INPUT_DIR is required}"
              release_tag=$(<"$metadata_dir/release-tag.txt")
              release_commit=$(<"$metadata_dir/release-commit.txt")
              release_version=$(<"$metadata_dir/release-version.txt")
              validation_mode=$(<"$metadata_dir/validation-mode.txt")

              if [[ "$EXPECTED_VALIDATION_MODE" != true ]] &&
                [[ "$RELEASE_SOURCE_BRANCH" != refs/heads/main ]]; then
                echo "##vso[task.logissue type=error]Production releases require a release build from refs/heads/main."
                exit 1
              fi

              if [[ "$release_tag" != "v${release_version}" ]] ||
                [[ ! "$release_commit" =~ ^[0-9a-f]{40}$ ]] ||
                [[ "$validation_mode" != "$EXPECTED_VALIDATION_MODE" ]]; then
                echo "##vso[task.logissue type=error]Release metadata is invalid or does not match validation mode."
                exit 1
              fi

              echo "##vso[build.updatebuildnumber]${release_tag}-cd-${BUILD_BUILDID}"
              echo "##vso[task.setvariable variable=releaseVersion;isOutput=true]${release_version}"
              echo "##vso[task.setvariable variable=releaseTag;isOutput=true]${release_tag}"
              echo "##vso[task.setvariable variable=releaseCommit;isOutput=true]${release_commit}"
          env:
            METADATA_INPUT_DIR: $(Pipeline.Workspace)/releaseBuild/release-metadata
            EXPECTED_VALIDATION_MODE: ${{ parameters.validationMode }}
            RELEASE_SOURCE_BRANCH: $(resources.pipeline.releaseBuild.sourceBranch)

        - download: releaseBuild
          artifact: unsigned_npm_packages
          displayName: Download unsigned npm packages

        - download: releaseBuild
          artifact: unsigned_crate_packages
          displayName: Download unsigned crate packages

        - download: releaseBuild
          artifact: unsigned_python_packages
          displayName: Download unsigned Python packages

        - download: releaseBuild
          artifact: nuget_signing_input
          displayName: Download NuGet signing input

        - download: releaseBuild
          artifact: standalone_release_assets
          displayName: Download standalone release assets

        - task: CopyFiles@2
          displayName: Stage npm packages
          inputs:
            SourceFolder: $(Pipeline.Workspace)/releaseBuild/unsigned_npm_packages
            Contents: '**'
            TargetFolder: $(Build.SourcesDirectory)/publish_artifacts_npm
            CleanTargetFolder: true

        - task: CopyFiles@2
          displayName: Stage crate packages
          inputs:
            SourceFolder: $(Pipeline.Workspace)/releaseBuild/unsigned_crate_packages
            Contents: '**'
            TargetFolder: $(Build.SourcesDirectory)/publish_artifacts_crates
            CleanTargetFolder: true

        - task: CopyFiles@2
          displayName: Stage Python packages
          inputs:
            SourceFolder: $(Pipeline.Workspace)/releaseBuild/unsigned_python_packages
            Contents: '**'
            TargetFolder: $(Build.SourcesDirectory)/publish_artifacts_python
            CleanTargetFolder: true

        - task: CopyFiles@2
          displayName: Stage NuGet packages
          inputs:
            SourceFolder: $(Pipeline.Workspace)/releaseBuild/nuget_signing_input
            Contents: '**'
            TargetFolder: $(Build.SourcesDirectory)/publish_artifacts_nuget
            CleanTargetFolder: true

        - task: CopyFiles@2
          displayName: Stage standalone release assets
          inputs:
            SourceFolder: $(Pipeline.Workspace)/releaseBuild/standalone_release_assets
            Contents: '**'
            TargetFolder: $(Build.SourcesDirectory)/publish_artifacts_standalone
            CleanTargetFolder: true

        - task: UseDotNet@2
          displayName: Install .NET 8 SDK for ESRP
          inputs:
            packageType: sdk
            version: 8.x

        - template: WebUI.Sign.PipelineTemplate.yml@webuiPipelines

    - ${{ if eq(parameters.validationMode, 'false') }}:
      - stage: TagRelease
        displayName: Tag release
        dependsOn: SignArtifacts
        variables:
          releaseTag: $[ stageDependencies.SignArtifacts.Sign.outputs['release.releaseTag'] ]
          releaseCommit: $[ stageDependencies.SignArtifacts.Sign.outputs['release.releaseCommit'] ]
        jobs:
        - job: Tag
          displayName: Create release tag
          steps:
          - checkout: self
            clean: true
            fetchDepth: 0
            persistCredentials: true

          - task: Bash@3
            displayName: Create annotated release tag
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                remote_ref="refs/azure-release-tags/${RELEASE_TAG}"

                git fetch --no-tags origin "$RELEASE_COMMIT"
                if git fetch --force origin "refs/tags/${RELEASE_TAG}:${remote_ref}" 2>/dev/null; then
                  existing_commit=$(git rev-parse "${remote_ref}^{}")
                  if [[ "$existing_commit" != "$RELEASE_COMMIT" ]]; then
                    echo "##vso[task.logissue type=error]${RELEASE_TAG} points to ${existing_commit}, not ${RELEASE_COMMIT}."
                    exit 1
                  fi
                  echo "${RELEASE_TAG} already points to ${RELEASE_COMMIT}."
                  exit 0
                fi

                git config user.name "Azure Pipelines"
                git config user.email "azure-pipelines@microsoft.com"
                git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "Release ${RELEASE_TAG}"
                if git push origin "refs/tags/${RELEASE_TAG}"; then
                  exit 0
                fi

                git fetch --force origin "refs/tags/${RELEASE_TAG}:${remote_ref}"
                raced_commit=$(git rev-parse "${remote_ref}^{}")
                if [[ "$raced_commit" != "$RELEASE_COMMIT" ]]; then
                  echo "##vso[task.logissue type=error]Concurrent tag ${RELEASE_TAG} points to ${raced_commit}, not ${RELEASE_COMMIT}."
                  exit 1
                fi
                echo "Concurrent release run created ${RELEASE_TAG} at the expected commit."
            env:
              RELEASE_TAG: $(releaseTag)
              RELEASE_COMMIT: $(releaseCommit)

      - stage: PublishRelease
        displayName: Publish GitHub and registry release
        dependsOn:
        - SignArtifacts
        - TagRelease
        variables:
          releaseTag: $[ stageDependencies.SignArtifacts.Sign.outputs['release.releaseTag'] ]
          releaseCommit: $[ stageDependencies.SignArtifacts.Sign.outputs['release.releaseCommit'] ]
        jobs:
        - job: PublishGitHub
          displayName: Publish GitHub Release
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              artifactName: unsigned_npm_packages
              targetPath: $(Build.SourcesDirectory)/publish_artifacts_npm
            - input: pipelineArtifact
              artifactName: unsigned_crate_packages
              targetPath: $(Build.SourcesDirectory)/publish_artifacts_crates
            - input: pipelineArtifact
              artifactName: unsigned_python_packages
              targetPath: $(Build.SourcesDirectory)/publish_artifacts_python
            - input: pipelineArtifact
              artifactName: signed_nuget_packages
              targetPath: $(Build.ArtifactStagingDirectory)/publish_artifacts_nuget
            - input: pipelineArtifact
              artifactName: standalone_release_assets
              targetPath: $(Build.SourcesDirectory)/publish_artifacts_standalone
          steps:
          - checkout: self
            clean: true

          - task: GitHubRelease@1
            displayName: Create GitHub Release
            inputs:
              gitHubConnection: fast
              repositoryName: microsoft/webui
              action: create
              target: $(releaseCommit)
              tagSource: userSpecifiedTag
              tag: $(releaseTag)
              title: $(releaseTag)
              releaseNotesSource: inline
              releaseNotesInline: ''
              addChangeLog: true
              changeLogCompareToRelease: lastFullRelease
              changeLogType: issueBased
              assets: |
                $(Build.SourcesDirectory)/publish_artifacts_npm/*
                $(Build.ArtifactStagingDirectory)/publish_artifacts_nuget/*
                $(Build.SourcesDirectory)/publish_artifacts_crates/*
                $(Build.SourcesDirectory)/publish_artifacts_python/*
                $(Build.SourcesDirectory)/publish_artifacts_standalone/*
              assetUploadMode: replace
              isDraft: false
              isPreRelease: false
              makeLatest: legacy

        - job: PublishNpm
          displayName: Publish npm packages
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              artifactName: unsigned_npm_packages
              targetPath: $(Build.SourcesDirectory)/publish_artifacts_npm
          steps:
          - checkout: self
            clean: true

          # The template skips package types whose artifact directory is absent.
          - template: WebUI.Release.PipelineTemplate.yml@webuiPipelines

        - job: PublishCrates
          displayName: Publish Rust crates
          templateContext:
            type: releaseJob
            isProduction: true
            inputs:
            - input: pipelineArtifact
              artifactName: unsigned_crate_packages
              targetPath: $(Build.SourcesDirectory)/publish_artifacts_crates
          steps:
          - checkout: self
            clean: true

          # The template skips package types whose artifact directory is absent.
          - template: WebUI.Release.PipelineTemplate.yml@webuiPipelines
