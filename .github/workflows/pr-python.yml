name: PR Python Checks

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pr-python.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/webui-expressions/**'
      - 'crates/webui-handler/**'
      - 'crates/webui-parser/**'
      - 'crates/webui-protocol/**'
      - 'crates/webui-python/**'
      - 'crates/webui-state/**'
      - 'xtask/src/publish.rs'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned by digest so a rebuilt upstream tag cannot silently change the
  # toolchain or sysroot the Linux wheels are built against.
  MANYLINUX_X64: messense/manylinux2014-cross:x86_64@sha256:13670ccc63c35e072661938181c046243c01d7bca7976b3914177fb9b162998d
  MANYLINUX_ARM64: messense/manylinux2014-cross:aarch64@sha256:32c92568ebee8db53e0598c21bcd06a6dd1649d45d507646a8a49313c50325f8

jobs:
  # Build every wheel in the release contract. The x64 wheels are handed to
  # `test-wheel` below; the ARM64 wheels are cross-compiled exactly as the
  # release pipeline cross-compiles them, so a build break surfaces here rather
  # than at release time. They are not installed - that needs ARM64 hardware.
  build-wheel:
    name: Build wheel / ${{ matrix.platform.label }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - label: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_tag: manylinux_2_17_x86_64.manylinux2014_x86_64
            artifact: python-wheel-linux-x64
          - label: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            platform_tag: macosx_10_12_x86_64
            artifact: python-wheel-macos-x64
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_tag: win_amd64
            artifact: python-wheel-windows-x64
          - label: Linux ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform_tag: manylinux_2_17_aarch64.manylinux2014_aarch64
            artifact: ''
          - label: macOS ARM64
            os: macos-15-intel
            target: aarch64-apple-darwin
            platform_tag: macosx_11_0_arm64
            artifact: ''
          - label: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            platform_tag: win_arm64
            artifact: ''

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Setup Rust
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.93'
          targets: ${{ matrix.platform.target }}

      - name: Cache Rust build
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: python-${{ matrix.platform.target }}
          cache-on-failure: true

      # abi3 needs no target interpreter and `generate-import-lib` synthesizes
      # the Windows ARM64 import library, so every target cross-compiles here.
      # Wheel build policy lives in xtask, like every other release artifact.
      - name: Build stable-ABI wheel
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "maturin==1.14.1"
          cargo xtask publish-python \
            --target "${{ matrix.platform.target }}" --out target/python-wheel

      - name: Build manylinux stable-ABI wheel
        if: runner.os == 'Linux'
        shell: bash
        env:
          IMAGE: ${{ matrix.platform.target == 'aarch64-unknown-linux-gnu' && env.MANYLINUX_ARM64 || env.MANYLINUX_X64 }}
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/io" -w /io "$IMAGE" \
            bash crates/webui-python/scripts/build-manylinux-wheel.sh \
              "${{ matrix.platform.target }}" target/python-wheel

      - name: Validate wheel name, tags, and license metadata
        shell: bash
        run: |
          set -euo pipefail
          python crates/webui-python/tests/validate_wheel.py \
            target/python-wheel "${{ matrix.platform.platform_tag }}"
          python crates/webui-python/tests/validate_artifacts.py \
            target/python-wheel/*.whl

      - name: Upload wheel
        if: matrix.platform.artifact != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.artifact }}
          path: target/python-wheel/*.whl
          if-no-files-found: error
          retention-days: 1

  # One abi3 wheel must serve every supported interpreter, so install the exact
  # wheel built on Python 3.11 and run the suite on each newer CPython.
  test-wheel:
    name: Test wheel / ${{ matrix.platform.label }} / CPython ${{ matrix.python }}
    needs: build-wheel
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - label: Linux x64
            os: ubuntu-latest
            artifact: python-wheel-linux-x64
            quality: true
          - label: macOS x64
            os: macos-15-intel
            artifact: python-wheel-macos-x64
            quality: false
          - label: Windows x64
            os: windows-latest
            artifact: python-wheel-windows-x64
            quality: false
        python: ['3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.platform.artifact }}
          path: target/python-wheel

      - name: Install the built wheel and test it
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pytest>=8.3,<10"
          python -m pip install --force-reinstall --no-deps --no-index \
            target/python-wheel/*.whl
          python -m pytest crates/webui-python/tests -q

      - name: Validate lint, strict typing, and stubs
        if: matrix.platform.quality && matrix.python == '3.11'
        working-directory: crates/webui-python
        run: |
          python -m pip install --upgrade "mypy>=1.19,<2" "ruff>=0.15,<1"
          python -m ruff check python tests benchmarks
          python -m mypy
          python -m mypy.stubtest microsoft_webui

  # The committed protocol fixture is a build output. Rebuild it from source and
  # fail if it drifted, so the Python tests never assert against a stale binary.
  fixture:
    name: Validate protocol fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: '1.93'

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: python-fixture
          cache-on-failure: true

      - name: Verify the release-target contract is restated consistently
        run: python crates/webui-python/tests/validate_release_targets.py

      - name: Rebuild and compare the protocol fixture
        shell: bash
        run: |
          set -euo pipefail
          output=target/python-fixture-check
          rm -rf "$output"
          cargo run --quiet -p microsoft-webui-cli -- build \
            crates/webui-python/tests/fixtures/app --plugin webui --out "$output"
          cargo run --quiet -p microsoft-webui-cli -- inspect \
            crates/webui-python/tests/fixtures/protocol.bin > "$output/committed.json"
          cargo run --quiet -p microsoft-webui-cli -- inspect \
            "$output/protocol.bin" > "$output/generated.json"
          python crates/webui-python/tests/compare_fixture.py \
            "$output/committed.json" "$output/generated.json"
          cmp crates/webui-python/tests/fixtures/greeting-card.css \
            "$output/greeting-card.css"
