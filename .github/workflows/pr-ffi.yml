name: PR FFI Checks

on:
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  ffi-tests:
    name: FFI Integration Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93

      - name: Rust Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build microsoft-webui-ffi
        run: cargo build -p microsoft-webui-ffi

      - name: Build FFI protocol fixture
        run: cargo run -p microsoft-webui-cli -- build crates/webui-ffi/tests/fixtures/app --out crates/webui-ffi/tests/fixtures/protocol.bin

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run Python FFI tests
        run: python crates/webui-ffi/tests/python/test_webui_ffi.py -v
        env:
          LD_LIBRARY_PATH: target/debug

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21'

      - name: Run Go FFI tests
        working-directory: crates/webui-ffi/tests/go
        run: go test -v
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
          CGO_LDFLAGS: -L${{ github.workspace }}/target/debug -lwebui_ffi -lm -ldl -lpthread

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Run C# FFI tests
        working-directory: crates/webui-ffi/tests/csharp
        run: dotnet test -v normal
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
