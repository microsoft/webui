name: WebUI AI review invalidation

on:
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  invalidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
      - name: Invalidate stale AI approval after human activity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBUI_AI_REVIEW_STAGED: "true"
        run: |
          if [ ! -f .github/scripts/webui-ai-review-invalidate.mjs ]; then
            echo "::notice::Invalidation script is not present on the default branch yet; skipping. It becomes available once the reviewer PR merges."
            exit 0
          fi
          node .github/scripts/webui-ai-review-invalidate.mjs
