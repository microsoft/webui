name: PR Checks

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Phase 1: Lint (fast, fail-fast) ────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
        with:
          skip-build: 'true'
          rust-components: clippy, rustfmt

      - name: License headers
        run: cargo xtask license-headers

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Deny (licenses & advisories)
        run: |
          cargo install --locked cargo-deny || true
          cargo deny check

  # ── Phase 2: Test (Ubuntu) ─────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
        with:
          skip-build: 'true'

      - name: Test
        run: cargo test --workspace

  # ── Phase 2: Build (Linux + macOS + Windows) ────────────────────────
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
        with:
          shared-cache-key: ubuntu-build

  build-macos:
    name: Build (macOS)
    runs-on: macos-latest-large
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build

  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build

  # ── Phase 3: E2E (Ubuntu, after Linux build) ───────────────────────
  e2e:
    name: E2E (Ubuntu)
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
        with:
          shared-cache-key: ubuntu-build
          cache-on-failure: 'true'

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: cargo xtask e2e

      - name: Regenerate baselines (on failure)
        if: failure()
        run: cargo xtask e2e --update-snapshots

      - name: Upload updated baselines (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-updated-baselines
          path: |
            examples/app/*/tests/*.spec.ts-snapshots/
            packages/*/tests/*.spec.ts-snapshots/
          retention-days: 7

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results
          path: |
            examples/app/*/test-results/
            packages/*/test-results/
          retention-days: 7

  # ── Phase 2: WASM (Ubuntu) ─────────────────────────────────────────
  wasm:
    name: WASM
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-wasm

  # ── Phase 2: Docs ─────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
        with:
          shared-cache-key: ubuntu-build

      - name: Build docs
        run: pnpm --filter @webui/docs... build

  # ── Phase 2: Python wheels ─────────────────────────────────────────
  # Build every wheel in the release contract. The x64 wheels feed python-test
  # below; the ARM64 wheels are cross-compiled exactly as the release pipeline
  # cross-compiles them, so an ARM64 build break surfaces on the PR that causes
  # it. They are never installed here - that needs ARM64 hardware.
  python-wheel:
    name: Python wheel (${{ matrix.platform.label }})
    runs-on: ${{ matrix.platform.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        platform:
          - label: Linux x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_tag: manylinux_2_17_x86_64.manylinux2014_x86_64
            image: messense/manylinux2014-cross:x86_64@sha256:13670ccc63c35e072661938181c046243c01d7bca7976b3914177fb9b162998d
            artifact: python-wheel-linux-x64
          - label: macOS x64
            os: macos-latest-large
            target: x86_64-apple-darwin
            platform_tag: macosx_10_12_x86_64
            artifact: python-wheel-macos-x64
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_tag: win_amd64
            artifact: python-wheel-windows-x64
          - label: Linux ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform_tag: manylinux_2_17_aarch64.manylinux2014_aarch64
            image: messense/manylinux2014-cross:aarch64@sha256:32c92568ebee8db53e0598c21bcd06a6dd1649d45d507646a8a49313c50325f8
            artifact: ''
          - label: macOS ARM64
            os: macos-latest-large
            target: aarch64-apple-darwin
            platform_tag: macosx_11_0_arm64
            artifact: ''
          - label: Windows ARM64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            platform_tag: win_arm64
            artifact: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Linux wheels build entirely inside the pinned manylinux image, so the
      # host toolchain is only needed for the targets built natively here.
      - uses: ./.github/actions/build
        if: runner.os != 'Linux'
        with:
          skip-build: 'true'
          rust-targets: ${{ matrix.platform.target }}
          shared-cache-key: python-${{ matrix.platform.target }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # abi3 needs no target interpreter and `generate-import-lib` synthesizes
      # the Windows ARM64 import library, so every target cross-compiles here.
      - name: Build wheel
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "maturin==1.14.1"
          cargo xtask publish-build --target "${{ matrix.platform.target }}" --python-only

      - name: Build manylinux wheel
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/io" -w /io "${{ matrix.platform.image }}" \
            bash crates/webui-python/scripts/build-manylinux-wheel.sh \
              "${{ matrix.platform.target }}"

      - name: Validate wheel name, tags, and license metadata
        shell: bash
        run: |
          set -euo pipefail
          python crates/webui-python/tests/validate_wheel.py \
            publish/python "${{ matrix.platform.platform_tag }}"
          python crates/webui-python/tests/validate_artifacts.py publish/python/*.whl

      - name: Upload wheel
        if: matrix.platform.artifact != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.artifact }}
          path: publish/python/*.whl
          if-no-files-found: error
          retention-days: 1

  # ── Phase 3: Python tests (after wheels) ───────────────────────────
  # One abi3 wheel must serve every supported interpreter, so the Linux wheel is
  # installed on each CPython. macOS and Windows only re-verify that the wheel
  # loads on its platform, which 3.11 already proves.
  python-test:
    name: Python test (${{ matrix.platform.label }} / CPython ${{ matrix.python }})
    runs-on: ${{ matrix.platform.os }}
    needs: python-wheel
    strategy:
      fail-fast: false
      matrix:
        platform:
          - label: Linux x64
            os: ubuntu-latest
            artifact: python-wheel-linux-x64
        python: ['3.11', '3.12', '3.13', '3.14']
        include:
          - platform:
              label: macOS x64
              os: macos-latest-large
              artifact: python-wheel-macos-x64
            python: '3.11'
          - platform:
              label: Windows x64
              os: windows-latest
              artifact: python-wheel-windows-x64
            python: '3.11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.platform.artifact }}
          path: publish/python

      - name: Install the built wheel and test it
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pytest>=8.3,<10"
          python -m pip install --force-reinstall --no-deps --no-index publish/python/*.whl
          python -m pytest crates/webui-python/tests -q

      - name: Validate lint, strict typing, and stubs
        if: runner.os == 'Linux' && matrix.python == '3.11'
        working-directory: crates/webui-python
        run: |
          python -m pip install --upgrade "mypy>=1.19,<2" "ruff>=0.15,<1"
          python -m ruff check python tests benchmarks
          python -m mypy
          python -m mypy.stubtest microsoft_webui

  # ── Phase 3: Python fixture drift (after Linux build) ──────────────
  # The committed protocol fixture is a build output, so rebuild it and fail if
  # it drifted, keeping the Python tests from asserting against a stale binary.
  python-fixture:
    name: Python fixture
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
        with:
          skip-build: 'true'
          shared-cache-key: ubuntu-build

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify the release-target contract is restated consistently
        run: python crates/webui-python/tests/validate_release_targets.py

      - name: Rebuild and compare the protocol fixture
        run: |
          set -euo pipefail
          output=target/python-fixture-check
          rm -rf "$output"
          cargo run --quiet -p microsoft-webui-cli -- build \
            crates/webui-python/tests/fixtures/app --plugin webui --out "$output"
          cargo run --quiet -p microsoft-webui-cli -- inspect \
            crates/webui-python/tests/fixtures/protocol.bin > "$output/committed.json"
          cargo run --quiet -p microsoft-webui-cli -- inspect \
            "$output/protocol.bin" > "$output/generated.json"
          python crates/webui-python/tests/compare_fixture.py \
            "$output/committed.json" "$output/generated.json"
          cmp crates/webui-python/tests/fixtures/greeting-card.css \
            "$output/greeting-card.css"
