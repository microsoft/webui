name: PR Checks

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Phase 1: Lint (fast, fail-fast) ────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
        with:
          skip-build: 'true'
          rust-components: clippy, rustfmt

      - name: License headers
        run: cargo xtask license-headers

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Deny (licenses & advisories)
        run: |
          cargo install --locked cargo-deny || true
          cargo deny check

  # ── Phase 2: Test (Ubuntu) ─────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
        with:
          skip-build: 'true'

      - name: Test
        run: cargo test --workspace

  # ── Phase 2: Build (Linux) ──────────────────────────────────────────
  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
        with:
          shared-cache-key: ubuntu-build

  # ── Phase 2: macOS check (native ARM64 runner) ─────────────────────
  # The Linux-hosted `cargo check` attempt added in this PR still executed C
  # build scripts (for example `zstd-sys` via actix-web), which failed before
  # linking because the generic Linux `cc` cannot compile Apple-targeted flags
  # like `-arch arm64`. Keep PR validation on a native Apple Silicon runner,
  # while the release pipeline continues to do the full Linux-hosted
  # cargo-zigbuild packaging flow with its trusted SDK.
  # `platform_tag` isn't consumed by `cargo check` itself; it's restated here
  # only so `validate_release_targets.py` sees all five release-contract
  # platform tags accounted for in this file.
  macos-check:
    name: macOS check (${{ matrix.platform.label }})
    runs-on: macos-14
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        platform:
          - label: ARM64
            target: aarch64-apple-darwin
            platform_tag: macosx_11_0_arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install protoc
        shell: bash
        run: |
          if ! command -v protoc >/dev/null 2>&1; then
            brew install protobuf
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93
          targets: ${{ matrix.platform.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: macos-check-${{ matrix.platform.target }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Check release crates
        shell: bash
        run: |
          cargo check --target ${{ matrix.platform.target }} \
            -p microsoft-webui-cli \
            -p microsoft-webui-ffi \
            -p microsoft-webui-node \
            -p microsoft-webui-python

  # ── Phase 2: Windows cross-build (from Linux, via cargo-xwin) ──────
  # There is no Windows runner in this pipeline either. `cargo xtask
  # publish-build` is host-aware: for a Windows MSVC target on a non-Windows
  # host it selects the cargo-xwin backend for the native CLI/FFI/Node
  # artifacts, then builds the abi3 wheel by running `maturin build` with
  # `cargo-xwin`'s own linker/SDK environment (from `cargo xwin env`)
  # exported onto it — maturin has no built-in `--xwin` flag — so one call
  # stages everything. This mirrors the same cargo-xwin cross-compilation
  # contract the release pipeline's Linux-hosted Windows legs use, pinned to
  # the same cargo-xwin/LLVM versions.
  windows-cross:
    name: Windows cross-build (${{ matrix.platform.label }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        platform:
          - label: x64
            target: x86_64-pc-windows-msvc
            platform_tag: win_amd64
          - label: ARM64
            target: aarch64-pc-windows-msvc
            platform_tag: win_arm64
    env:
      WINDOWS_STAGE: target/windows-stage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
        with:
          skip-build: 'true'
          rust-targets: ${{ matrix.platform.target }}
          shared-cache-key: windows-cross-${{ matrix.platform.target }}

      - name: Install cargo-xwin and pin its LLVM toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-18 lld-18 llvm-18
          sudo ln -sf /usr/bin/clang-18 /usr/local/bin/clang-cl
          sudo ln -sf /usr/bin/lld-link-18 /usr/local/bin/lld-link
          sudo ln -sf /usr/bin/llvm-lib-18 /usr/local/bin/llvm-lib
          cargo install --locked cargo-xwin --version 0.23.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Build native artifacts and abi3 wheel (cargo xtask publish-build)
        run: |
          set -euo pipefail
          python -m pip install --upgrade "maturin==1.14.1"
          mkdir -p "$XWIN_CACHE_DIR"
          cargo xtask publish-build --target ${{ matrix.platform.target }} \
            --output "$WINDOWS_STAGE"
        env:
          XWIN_ACCEPT_LICENSE: '1'
          XWIN_CACHE_DIR: ${{ github.workspace }}/target/xwin-cache

  # ── Phase 3: E2E (Ubuntu, after Linux build) ───────────────────────
  e2e:
    name: E2E (Ubuntu)
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
        with:
          shared-cache-key: ubuntu-build
          cache-on-failure: 'true'

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: cargo xtask e2e

      - name: Regenerate baselines (on failure)
        if: failure()
        run: cargo xtask e2e --update-snapshots

      - name: Upload updated baselines (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-updated-baselines
          path: |
            examples/app/*/tests/*.spec.ts-snapshots/
            packages/*/tests/*.spec.ts-snapshots/
          retention-days: 7

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-test-results
          path: |
            examples/app/*/test-results/
            packages/*/test-results/
          retention-days: 7

  # ── Phase 2: WASM (Ubuntu) ─────────────────────────────────────────
  wasm:
    name: WASM
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-wasm

  # ── Phase 2: Docs ─────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
        with:
          shared-cache-key: ubuntu-build

      - name: Build docs
        run: pnpm --filter @webui/docs... build

  # ── Phase 3: FFI bindings (after Linux build) ──────────────────────
  # Exercises the C ABI from Python, Go, and C#. Depends on build-linux and
  # shares its cache key: these are the same debug workspace crates that job
  # already compiled, so the cargo steps below are a cache hit rather than a
  # second full build.
  ffi:
    name: FFI
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
        with:
          skip-build: 'true'
          shared-cache-key: ubuntu-build
          dotnet: '8.0.x'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21'

      - name: Build FFI library and protocol fixture
        run: |
          cargo build -p microsoft-webui-ffi
          cargo run -p microsoft-webui-cli -- build \
            crates/webui-ffi/tests/fixtures/app \
            --out crates/webui-ffi/tests/fixtures/protocol.bin

      - name: Run Python FFI tests
        run: python crates/webui-ffi/tests/python/test_webui_ffi.py -v
        env:
          LD_LIBRARY_PATH: target/debug

      - name: Run Go FFI tests
        working-directory: crates/webui-ffi/tests/go
        run: go test -v
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug
          CGO_LDFLAGS: -L${{ github.workspace }}/target/debug -lwebui_ffi -lm -ldl -lpthread

      - name: Run C# FFI tests
        working-directory: crates/webui-ffi/tests/csharp
        run: dotnet test -v normal
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/debug

  # ── Phase 2: Python wheels (Linux) ──────────────────────────────────
  # Build the Linux wheels in the release contract. The x64 wheel feeds
  # python-test below; the ARM64 wheel is cross-compiled exactly as the
  # release pipeline cross-compiles it, so an ARM64 build break surfaces on
  # the PR that causes it. It is never installed here - that needs ARM64
  # hardware. Windows and macOS wheels are covered by windows-cross and
  # macos-check instead: neither has a runtime test here, since non-Linux
  # runtime tests are intentionally out of scope for this pipeline.
  python-wheel:
    name: Python wheel (${{ matrix.platform.label }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        platform:
          - label: Linux x64
            target: x86_64-unknown-linux-gnu
            platform_tag: manylinux_2_17_x86_64.manylinux2014_x86_64
            image: messense/manylinux2014-cross:x86_64@sha256:13670ccc63c35e072661938181c046243c01d7bca7976b3914177fb9b162998d
            artifact: python-wheel-linux-x64
          - label: Linux ARM64
            target: aarch64-unknown-linux-gnu
            platform_tag: manylinux_2_17_aarch64.manylinux2014_aarch64
            image: messense/manylinux2014-cross:aarch64@sha256:32c92568ebee8db53e0598c21bcd06a6dd1649d45d507646a8a49313c50325f8
            artifact: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      # Linux wheels build entirely inside the pinned manylinux image, so no
      # host Rust toolchain setup is needed here.
      - name: Build manylinux wheel
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/io" -w /io "${{ matrix.platform.image }}" \
            bash crates/webui-python/scripts/build-manylinux-wheel.sh \
              "${{ matrix.platform.target }}"

      - name: Validate wheel name, tags, and license metadata
        shell: bash
        run: |
          set -euo pipefail
          python crates/webui-python/tests/validate_wheel.py \
            publish/python "${{ matrix.platform.platform_tag }}"
          python crates/webui-python/tests/validate_artifacts.py publish/python/*.whl

      - name: Upload wheel
        if: matrix.platform.artifact != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.artifact }}
          path: publish/python/*.whl
          if-no-files-found: error
          retention-days: 1

  # ── Phase 3: Python tests (Linux, after wheels) ────────────────────
  # One abi3 wheel must serve every supported interpreter, so the Linux x64
  # wheel is installed on each CPython. This is the only runtime test of the
  # wheel in this pipeline - Windows and macOS are cross-built/checked only.
  python-test:
    name: Python test (Linux x64 / CPython ${{ matrix.python }})
    runs-on: ubuntu-latest
    needs: python-wheel
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-wheel-linux-x64
          path: publish/python

      - name: Install the built wheel and test it
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade "pytest>=8.3,<10"
          python -m pip install --force-reinstall --no-deps --no-index publish/python/*.whl
          python -m pytest crates/webui-python/tests -q

      - name: Validate lint, strict typing, and stubs
        if: matrix.python == '3.11'
        working-directory: crates/webui-python
        run: |
          python -m pip install --upgrade "mypy>=1.19,<2" "ruff>=0.15,<1"
          python -m ruff check python tests benchmarks
          python -m mypy
          python -m mypy.stubtest microsoft_webui

  # ── Phase 3: Python fixture drift (after Linux build) ──────────────
  # The committed protocol fixture is a build output, so rebuild it and fail if
  # it drifted, keeping the Python tests from asserting against a stale binary.
  python-fixture:
    name: Python fixture
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build
        with:
          skip-build: 'true'
          shared-cache-key: ubuntu-build

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify the release-target contract is restated consistently
        run: python crates/webui-python/tests/validate_release_targets.py

      - name: Rebuild and compare the protocol fixture
        run: |
          set -euo pipefail
          output=target/python-fixture-check
          rm -rf "$output"
          cargo run --quiet -p microsoft-webui-cli -- build \
            crates/webui-python/tests/fixtures/app --plugin webui --out "$output"
          cargo run --quiet -p microsoft-webui-cli -- inspect \
            crates/webui-python/tests/fixtures/protocol.bin > "$output/committed.json"
          cargo run --quiet -p microsoft-webui-cli -- inspect \
            "$output/protocol.bin" > "$output/generated.json"
          python crates/webui-python/tests/compare_fixture.py \
            "$output/committed.json" "$output/generated.json"
          cmp crates/webui-python/tests/fixtures/greeting-card.css \
            "$output/greeting-card.css"

  # ── Gate: one stable required check ────────────────────────────────
  # Branch protection can only require per-job contexts, so requiring the jobs
  # individually means editing that list every time one is added, renamed, or
  # removed. Require this job instead: it is the only context that has to be
  # protected, and it stays correct as the matrix above evolves.
  pr-checks:
    name: PR Checks
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - test
      - build-linux
      - macos-check
      - windows-cross
      - e2e
      - wasm
      - docs
      - ffi
      - python-wheel
      - python-test
      - python-fixture
    steps:
      # `needs` collapses each matrix to a single result, so this covers every
      # wheel and interpreter leg too. Skipped counts as failure: nothing here
      # is conditionally skipped, so a skip only happens when a dependency
      # failed and took its dependents with it.
      - name: Verify every job succeeded
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo "::error::One or more PR checks did not succeed."
          exit 1
