<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <style>
    @property --ntp-ready { syntax: "<integer>"; inherits: false; initial-value: 0; }
    html, body { height: 100%; margin: 0; }
    body { overflow: hidden; background: #1b2635; color: #fff; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
    /* Below the 56px top bar: Chromium ignores a full-viewport image as LCP. */
    .ntp-bg { position: fixed; top: 56px; left: 0; width: 100%; height: calc(100% - 56px); object-fit: cover; }
  </style>
</head>
<body>
  <img class="ntp-bg" src="bg.jpg" alt="" fetchpriority="high">
  <ntp-app></ntp-app>
  <script type="module" src="./main.js"></script>
</body>
</html>
