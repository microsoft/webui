<div class="suggest" data-ui="suggest" role="listbox" aria-label="Search suggestions">
  <p class="suggest-head" data-ready>Suggestions for &#8220;{{query}}&#8221;</p>
  <ul class="suggest-list">
    <for each="item in suggestions">
      <li role="option" class="suggestion" data-text="{{item.text}}" @click="{pickSuggestion(e)}">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" /><path d="m13 13 4 4" /></svg>
        <span><strong>{{item.prefix}}</strong>{{item.rest}}</span>
      </li>
    </for>
  </ul>
  <p class="suggest-head">Trending now</p>
  <ul class="trending">
