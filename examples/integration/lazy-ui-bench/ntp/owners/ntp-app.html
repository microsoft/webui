<template shadowrootmode="open">
  <ntp-background></ntp-background>
  <header class="bar">
    <ntp-app-launcher></ntp-app-launcher>
    <a class="brand" href="https://www.msn.com/">Microsoft Start</a>
    <span class="spacer"></span>
    <a class="weather" href="https://www.msn.com/weather/forecast" title="{{weatherSummary}}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10z M12 1v2 M12 21v2 M4.2 4.2l1.4 1.4 M18.4 18.4l1.4 1.4 M1 12h2 M21 12h2 M4.2 19.8l1.4-1.4 M18.4 5.6l1.4-1.4" /></svg>
      <span>{{temperature}}</span>
    </a>
    <ntp-market></ntp-market>
    <ntp-settings></ntp-settings>
    <ntp-sign-in></ntp-sign-in>
  </header>
  <main class="center">
    <ntp-search></ntp-search>
    <ntp-top-sites></ntp-top-sites>
  </main>
  <footer class="peek"><a class="peek-link" href="https://www.msn.com/feed">Scroll for headlines</a></footer>
</template>
