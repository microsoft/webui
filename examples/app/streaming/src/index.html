<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="{{basePath}}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebUI Streaming Priority Demo</title>

  <!--
    Loaded early and async so the composer boundary below can hydrate
    while the response is still open. The handler marks each streamed SSR
    component host with a temporary compiler-owned identity before browser
    upgrade, so an upgraded element defers until its complete boundary
    commits. See DESIGN.md, "Progressive Streaming Hydration"
    ("Initialization ordering").
  -->
  <script type="module" async src="./index.js"></script>

  <style>
    :root {
      /*{{{tokens.light}}}*/
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        /*{{{tokens.dark}}}*/
      }
    }

    body {
      font-family: var(--font-family-base);
      max-width: 720px;
      margin: 0 auto;
      padding: var(--spacing-xl);
      line-height: var(--line-height-base);
    }

    streaming-page {
      display: block;
    }
  </style>
</head>
<body>
  <streaming-page
    :feed-batch-1="{{feedBatch1}}"
    :feed-batch-2="{{feedBatch2}}"
    :feed-batch-3="{{feedBatch3}}"
  ></streaming-page>
</body>
</html>
