<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <base href="{{basePath}}">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebUI Streaming Priority Demo</title>

  <!--
    Loaded early and async so the composer boundary below can hydrate
    while the response is still open. The handler marks each streamed SSR
    component host with a temporary compiler-owned identity before browser
    upgrade, so an upgraded element defers until its complete boundary
    commits. See DESIGN.md, "Progressive Streaming Hydration — Phase 1"
    ("Initialization ordering").

    The preload hints come first because `index.js` statically imports a
    shared runtime chunk that the preload scanner cannot see behind the
    script tag. Without them the browser discovers that chunk only after
    downloading and parsing `index.js`, and the round trip costs about
    110ms of composer time-to-interactive. The filenames are content-hashed,
    so the client build records them and `server/src/preload.rs` renders
    them here. The weather island is deliberately not preloaded.
  -->
  {{{modulePreloads}}}
  <script type="module" async src="./index.js"></script>

  <style>
    :root {
      /*{{{tokens.light}}}*/
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        /*{{{tokens.dark}}}*/
      }
    }

    body {
      font-family: var(--font-family-base);
      max-width: 720px;
      margin: 0 auto;
      padding: var(--spacing-xl);
      line-height: var(--line-height-base);
    }

    header {
      margin-bottom: var(--spacing-xl);
    }

    main {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-xl);
    }

    section[aria-label="Feed"] {
      display: flex;
      flex-direction: column;
      gap: var(--spacing-m);
    }
  </style>
</head>
<body>
  <header>
    <h1>Home</h1>
    <!--
      Weather represents expensive backend work whose data is not ready in
      document order. Native HTML streaming is strictly in-order, so nothing
      later in this response can reach back into an already-closed header —
      and blocking this boundary until the forecast resolved would stall the
      composer below, which is exactly the head-of-line blocking boundaries
      exist to remove.

      So this is the cheapest boundary on the page: it carries no server data
      and commits immediately, which gets `weather-panel` hydrated while the
      response is still open. The component then fetches its own forecast, so
      the slow backend work overlaps the rest of the stream instead of
      queueing behind it. See `weather-panel.ts`, and DESIGN.md's Phase 2
      "deferred boundary placement" note for the in-response alternative.
    -->
    <boundary name="weather-shell">
      <!--
        The island's code ships with the island, not with the critical
        bundle. The browser discovers this script when the weather chunk
        reaches the parser, so `index.js` never carries the panel's bytes and
        the composer's time to interactive does not pay for them.

        Loading it late is safe by construction: the boundary commits before
        the class exists, the coordinator parks the root on
        `customElements.whenDefined('weather-panel')` with this boundary's
        state stashed on it, and activates it the moment `.define()` runs.
        `webui:hydration-complete` waits for that.
      -->
      <script type="module" async src="./weather-panel.js"></script>
      <weather-panel status="loading"></weather-panel>
    </boundary>
  </header>

  <main>
    <boundary name="composer-ready">
      <message-composer draft="" posted=""></message-composer>
    </boundary>

    <section aria-label="Feed">
      <boundary name="feed-batch-1">
        <for each="post in feedBatch1">
          <feed-item post-id="{{post.postId}}" author="{{post.author}}" text="{{post.text}}" like-count="{{post.likeCount}}"></feed-item>
        </for>
      </boundary>

      <boundary name="feed-batch-2">
        <for each="post in feedBatch2">
          <feed-item post-id="{{post.postId}}" author="{{post.author}}" text="{{post.text}}" like-count="{{post.likeCount}}"></feed-item>
        </for>
      </boundary>

      <boundary name="feed-batch-3">
        <for each="post in feedBatch3">
          <feed-item post-id="{{post.postId}}" author="{{post.author}}" text="{{post.text}}" like-count="{{post.likeCount}}"></feed-item>
        </for>
      </boundary>
    </section>
  </main>
</body>
</html>
