[package]
name = "marketplace-api"
version = "3.0.1"
edition = "2021"
publish = false

[[bin]]
name = "marketplace-api"
path = "src/main.rs"

[dependencies]
actix-http = { workspace = true }
actix-server = { workspace = true }
actix-service = { workspace = true }
actix-tls = { workspace = true }
actix-web = { workspace = true, features = ["compress-gzip"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
native-tls = { workspace = true }
tokio-native-tls = { workspace = true }
microsoft-webui = { path = "../../../../crates/webui" }
microsoft-webui-handler = { path = "../../../../crates/webui-handler" }
bytes = { workspace = true }
mime_guess = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
log = { workspace = true }

[lints]
workspace = true
