[package]
name = "native-services-demo"
version = "0.1.0"
edition.workspace = true
publish = false

[[bin]]
name = "native-services-demo"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
futures-executor = { workspace = true }
getrandom = { workspace = true }
microsoft-webui-desktop = { path = "../../../../crates/webui-desktop", features = [
    "native-picker",
    "native-dialogs",
    "native-capture",
    "native-clipboard",
] }
microsoft-webui-handler = { path = "../../../../crates/webui-handler" }
microsoft-webui-tokens = { path = "../../../../crates/webui-tokens" }
serde_json = { workspace = true }

[lints]
workspace = true
