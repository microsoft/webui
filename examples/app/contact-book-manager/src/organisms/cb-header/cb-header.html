<header class="header" ?webui-drag="{{mode == 'desktop'}}">
  <div class="header-left">
    <h1 class="title">
      <if condition="mode == 'desktop'">Contact Book</if>
      <if condition="mode != 'desktop'">Contacts</if>
    </h1>
  </div>
  <div class="header-actions">
    <div class="header-center">
      <div class="search-container" role="search" webui-no-drag>
        <svg class="search-icon" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true" focusable="false">
          <circle cx="8.5" cy="8.5" r="5.5" stroke="currentColor" stroke-width="1.5"></circle>
          <path d="m12.5 12.5 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
        </svg>
        <input class="search-input" type="search" aria-label="Search contacts" placeholder="Search contacts..." value="{{searchQuery}}" @input="{onInput(e)}" webui-no-drag />
      </div>
    </div>
    <div class="header-right">
      <a class="add-btn" href="./contacts/add" webui-no-drag>
        <span class="add-icon" aria-hidden="true">+</span>
        <span class="add-label">Add Contact</span>
      </a>
    </div>
  </div>
  <if condition="mode == 'desktop'">
    <div class="window-controls" role="group" aria-label="Window controls" webui-no-drag>
      <button class="window-control" type="button" aria-label="Minimize window" title="Minimize window" @click="{onWindowAction('minimize')}" webui-no-drag>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
          <path d="M3 8h10" stroke="currentColor" stroke-width="1.25"></path>
        </svg>
      </button>
      <button class="window-control" type="button" aria-label="Maximize or restore window" title="Maximize or restore window" @click="{onWindowAction('toggle-maximize')}" webui-no-drag>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
          <rect x="3.5" y="3.5" width="9" height="9" rx="0.5" stroke="currentColor" stroke-width="1.25"></rect>
        </svg>
      </button>
      <button class="window-control window-close" type="button" aria-label="Close window" title="Close window" @click="{onWindowAction('close')}" webui-no-drag>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" focusable="false">
          <path d="m4 4 8 8m0-8-8 8" stroke="currentColor" stroke-width="1.25"></path>
        </svg>
      </button>
    </div>
  </if>
</header>
