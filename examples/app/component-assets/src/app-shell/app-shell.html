<section class="shell">
  <p class="eyebrow">No router and no template endpoint</p>
  <h1>{{title}}</h1>
  <asset-badge label="Shared SSR component"></asset-badge>
  <p class="summary">
    Two lazy roots share one lazy-only detail component. Their generated root
    assets load that payload from one shared chunk, while the SSR badge remains
    owned by the entry protocol.
  </p>

  <div class="actions">
    <button
      @pointerover="{preloadPanel()}"
      @focusin="{preloadPanel()}"
      @click="{openPanel()}"
    >Load lazy panel</button>
    <button
      @pointerover="{preloadSecondaryPanel()}"
      @focusin="{preloadSecondaryPanel()}"
      @click="{openSecondaryPanel()}"
    >Load secondary panel</button>
  </div>
  <div class="panel-slot" w-ref="{panelSlot}"></div>
  <div class="panel-slot" w-ref="{secondaryPanelSlot}"></div>
</section>
