<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Streaming Fixture</title>
    <script type="module" async src="./index.js"></script>
  </head>
  <body>
    <if condition="show">
      <for each="item in items">
        <boundary name="row" key="{{item.id}}">
          <stream-item label="{{item.label}}"></stream-item>
        </boundary>
      </for>
    </if>
    <p>always-complete</p>
  </body>
</html>
