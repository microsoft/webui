<for each="head in headItems">
  <span class="head-item">{{head}}</span>
</for>
<section class="panel">
  <div class="panel-head">
    <for each="inner in innerItems">
      <span class="inner-item">{{inner}}</span>
    </for>
  </div>
  <div class="panel-body">body</div>
</section>
<for each="tail in tailItems">
  <span class="tail-item">{{tail}}</span>
</for>
