<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>SSR attribute propagation</title></head>
<body>
  <test-attribute-dialog id="literal" open aria-label="Canvas information" aria-describedby="details" dialog-title="Projected title"><p>Server content</p></test-attribute-dialog>
  <test-attribute-dialog id="absent"></test-attribute-dialog>
  <test-attribute-dialog id="empty" open="" aria-label=""></test-attribute-dialog>
  <test-attribute-dialog id="false-text" open="false" aria-label="Still open"></test-attribute-dialog>
  <test-attribute-dialog id="dynamic" ?open="{{initiallyOpen}}" aria-label="{{name}}"></test-attribute-dialog>
  <test-attribute-dialog id="closed" ?open="{{initiallyClosed}}"></test-attribute-dialog>
  <test-inherited-dialog id="inherited-old" old-expanded></test-inherited-dialog>
  <test-inherited-dialog id="inherited-new" new-expanded=""></test-inherited-dialog>
  <test-inherited-dialog id="inherited-old-first" old-expanded new-expanded=""></test-inherited-dialog>
  <test-inherited-dialog id="inherited-new-first" new-expanded="" old-expanded></test-inherited-dialog>
  <test-stacked-dialog id="stacked-first" first-expanded></test-stacked-dialog>
  <test-stacked-dialog id="stacked-second" second-expanded=""></test-stacked-dialog>
  <test-stacked-dialog id="stacked-first-order" first-expanded second-expanded=""></test-stacked-dialog>
  <test-stacked-dialog id="stacked-second-order" second-expanded="" first-expanded></test-stacked-dialog>
</body>
</html>
