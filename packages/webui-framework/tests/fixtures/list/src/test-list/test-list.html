<template shadowrootmode="open" @toggle-item="{toggleItem(e)}">
  <div class="controls">
    <button class="add" @click="{addItem()}">Add</button>
    <button class="prepend" @click="{prependItem()}">Prepend</button>
    <button class="reverse" @click="{reverseItems()}">Reverse</button>
    <button class="clear" @click="{clearItems()}">Clear</button>
    <button class="set-after-repeat" @click="{setAfterRepeat()}">Set After</button>
    <span class="count">{{items.length}}</span>
  </div>
  <div class="items">
    <for each="item in items">
      <test-list-item key="{{item.id}}" item-id="{{item.id}}" title="{{item.title}}" state="{{item.state}}" ?data-done="{{item.state == 'done'}}" ?data-flagged="{{item.flagged}}"></test-list-item>
      <button class="loop-arg" @click="{selectItem(item.id)}">{{item.title}}</button>
      <button class="loop-arg-event" @click="{selectItemWithEvent(item.id, e)}">{{item.title}}</button>
    </for>
    {{afterRepeat}}<span class="after-repeat-tail">Tail</span>
  </div>
  <div class="last-loop-arg">{{lastLoopArg}}</div>
  <for each="project in shell.nav.canvas_projects">
    <button key="{{project.id}}" class="project-link" @click="{selectItem(project.id)}">{{project.title}}</button>
  </for>
  <button class="title-length" @click="{selectItem(shell.title.length)}">Read title length</button>
  <button class="reveal-length" @click="{revealTitleLength()}">Reveal title length</button>
  <if condition="showTitleLength">
    <b class="visible-length">{{shell.tip.length}}</b>
    <b class="visible-length">{{shell.astralTip.length}}</b>
    <b class="visible-length">{{shell.emptyTip.length}}</b>
  </if>
  <for each="name in shell.names">
    <span class="name-length-ssr">{{name.length}}</span>
    <button class="name-length" @click="{selectItem(name.length)}">Read name length</button>
  </for>
</template>
