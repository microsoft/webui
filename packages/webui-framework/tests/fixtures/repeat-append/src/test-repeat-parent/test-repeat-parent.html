<button class="add" @click="{addItem()}">Add</button>
<button class="prepend" @click="{prependItem()}">Prepend</button>
<button class="insert-middle" @click="{insertMiddleItem()}">Insert middle</button>
<button class="remove-middle" @click="{removeMiddleItem()}">Remove middle</button>
<button class="remove" @click="{removeItem()}">Remove</button>
<div class="list">
  <for each="item in items">
    <test-repeat-child label="{{item.title}}"></test-repeat-child>
  </for>
</div>
