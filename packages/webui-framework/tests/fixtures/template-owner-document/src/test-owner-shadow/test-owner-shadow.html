<template shadowrootmode="open">
  <video class="direct" muted></video>
  <test-owner-probe data-kind="direct"></test-owner-probe>
  <if condition="showConditional">
    <video class="conditional" muted></video>
    <test-owner-probe data-kind="conditional"></test-owner-probe>
  </if>
  <for each="item in items">
    <section data-item="{{item.id}}">
      <video class="repeat" muted></video>
      <test-owner-probe data-kind="repeat"></test-owner-probe>
    </section>
  </for>
</template>
