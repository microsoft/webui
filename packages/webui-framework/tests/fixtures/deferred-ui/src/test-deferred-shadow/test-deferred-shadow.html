<template shadowrootmode="open">
  <button class="open" @pointerenter="{preload()}" @focus="{preload()}" @click="{open()}">Open</button>
  <button class="close" @click="{close()}">Close</button>
  <if condition="loading"><p class="loading">Loading...</p></if>
  <if condition="error"><p class="error">{{error}}</p></if>
  <if condition="opened" defer id="details">
    <section class="deferred-body">
      <h2>{{label}}</h2>
      <p class="message">{{message}}</p>
      <span class="count">{{count}}</span>
      <button class="increment" @click="{increment()}">Increment</button>
      <input w-ref="{inputEl}" value="{{label}}" />
      <if condition="expanded"><strong class="expanded">Expanded inline body</strong></if>
      <ul><for each="item in items"><li><button class="pick" @click="{pick(item.id)}">{{item.label}}</button></li></for></ul>
      <span class="chosen">{{chosen}}</span>
      <if condition="advanced" defer id="advanced"><p class="advanced">Nested deferred body</p></if>
    </section>
    <aside class="second-root">Second inline root</aside>
  </if>
  <if condition="single" defer id="single">
    <input class="single-ref" w-ref="{singleEl}" value="{{message}}" />
  </if>
</template>
