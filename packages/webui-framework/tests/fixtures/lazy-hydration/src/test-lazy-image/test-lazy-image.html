<template w-hydrate="lazy">
<img
  class="image"
  src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=="
  alt=""
  width="1"
  height="1"
  loading="eager"
  w-ref="{image}"
  @load="{recordImageLoad()}"
  @error="{recordImageError()}"
>
<output class="image-status">{{imageStatus}}</output>
</template>
