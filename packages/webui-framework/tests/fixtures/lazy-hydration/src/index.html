<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="webui-streaming" content="1">
  <title>Lazy Hydration Fixture</title>
  <style>
    body {
      min-height: 9000px;
      margin: 0;
    }

    test-lazy-item,
    test-lazy-parent,
    test-lazy-list,
    test-lazy-image,
    test-offscreen-item,
    test-late-offscreen-item,
    test-barrier-parent,
    test-streamed-lazy-parent,
    test-shadow-policy-parent,
    test-static-parent {
      display: block;
    }

    test-lazy-item {
      min-height: 72px;
    }

    #visible {
      position: absolute;
      top: 0;
    }

    #near {
      position: absolute;
      top: 850px;
    }

    #offscreen {
      position: absolute;
      top: 1400px;
    }

    #offscreen-eager-escape {
      position: absolute;
      top: 1600px;
    }

    #nested {
      position: absolute;
      top: 2200px;
    }

    #reconnect {
      position: absolute;
      top: 3000px;
    }

    #list-root {
      position: absolute;
      top: 3800px;
    }

    #early-image,
    #early-image-error {
      position: absolute;
      top: 5200px;
    }

    #early-image-error {
      top: 5400px;
    }

    #streamed {
      position: absolute;
      top: 6200px;
    }

    #render-offscreen,
    #render-hydrate-eager,
    #render-eager {
      position: absolute;
      top: 6600px;
    }

    #render-hydrate-eager {
      top: 6800px;
    }

    #render-eager {
      top: 7000px;
    }

    #render-native-near {
      position: absolute;
      top: 1200px;
    }

    #barrier-parent {
      position: absolute;
      top: 7400px;
    }

    #static-parent {
      position: absolute;
      top: 7800px;
    }

    #streamed-nested {
      position: absolute;
      top: 8200px;
    }

    #shadow-policy-parent {
      position: absolute;
      top: 8500px;
    }

    #nested-scroller {
      position: absolute;
      top: 100px;
      right: 20px;
      width: 360px;
      height: 240px;
      overflow: auto;
      border: 1px solid;
    }

    #scroller-spacer {
      height: 800px;
    }
  </style>
</head>
<body>
  <test-lazy-item id="visible" label="Visible" count="0"></test-lazy-item>
  <test-lazy-item id="near" label="Near" count="0"></test-lazy-item>
  <test-lazy-item id="offscreen" label="Offscreen" count="0"></test-lazy-item>
  <test-lazy-item
    id="offscreen-eager-escape"
    w-hydrate="eager"
    label="OffscreenEagerEscape"
    count="0"
  ></test-lazy-item>

  <div id="nested-scroller">
    <div id="scroller-spacer"></div>
    <test-lazy-item id="scrolled" label="Scrolled" count="0"></test-lazy-item>
  </div>

  <test-lazy-parent id="nested" label="Nested"></test-lazy-parent>
  <test-lazy-item id="reconnect" label="Reconnect" count="0"></test-lazy-item>
  <test-lazy-list id="list-root"></test-lazy-list>
  <test-lazy-image id="early-image"></test-lazy-image>
  <test-lazy-image id="early-image-error"></test-lazy-image>
  <test-lazy-item id="streamed" data-ws label="Streamed SSR" count="1"></test-lazy-item>
  <test-offscreen-item id="render-offscreen" label="Rendered offscreen" count="0"></test-offscreen-item>
  <test-offscreen-item
    id="render-hydrate-eager"
    w-hydrate="eager"
    label="Hydrate eager"
    count="0"
  ></test-offscreen-item>
  <test-offscreen-item
    id="render-eager"
    w-render="eager"
    label="Render eager"
    count="0"
  ></test-offscreen-item>
  <test-late-offscreen-item
    id="render-native-near"
    label="Native near"
    count="0"
  ></test-late-offscreen-item>
  <test-barrier-parent id="barrier-parent"></test-barrier-parent>
  <test-streamed-lazy-parent
    id="streamed-nested"
  ></test-streamed-lazy-parent>
  <test-shadow-policy-parent
    id="shadow-policy-parent"
  ></test-shadow-policy-parent>
  <test-static-parent
    id="static-parent"
    label="Static child"
  ></test-static-parent>
</body>
</html>
