<template shadowrootmode="open">
  <test-completion-child value="{{value}}"></test-completion-child>
  <slot></slot>
  <div class="raw">{{{html}}}</div>
  <for each="row in rows">
    <test-completion-child key="{{row.id}}" data-row="{{row.id}}" value="{{row.value}}"></test-completion-child>
  </for>
  <if condition="showUnloaded">
    <test-completion-unloaded :payload="{{payload}}"></test-completion-unloaded>
  </if>
  <test-completion-lazy></test-completion-lazy>
</template>
