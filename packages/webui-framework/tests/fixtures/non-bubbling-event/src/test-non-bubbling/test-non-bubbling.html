<button class="btn" @click="{onClick()}">Click</button><input class="field" @focus="{onFocus(e)}" @blur="{onBlur()}"><img class="thumb" alt="" @error="{onImgError()}"><div class="box" @mouseenter="{onEnter()}">Hover</div><ul class="rows"><for each="item in items"><li><input class="row-input" data-id="{{item.id}}" @focus="{onRowFocus(item.id, e)}"></li></for></ul><span class="clicks">{{clicks}}</span><span class="focuses">{{focuses}}</span><span class="blurs">{{blurs}}</span><span class="errors">{{errors}}</span><span class="enters">{{enters}}</span><span class="row-id">{{lastRowId}}</span><span class="ct">{{lastCurrentTarget}}</span>
