[workspace]
members = [
    "crates/*",
    "xtask",
    "examples/integration/rust",
    "examples/integration/streaming-browser-bench/server",
    "examples/app/commerce/server",
    "examples/demo/server",
]
resolver = "2"

[workspace.package]
version = "0.0.28"
edition = "2021"
rust-version = "1.93"
authors = ["Microsoft Edge"]
license = "MIT"
repository = "https://github.com/microsoft/webui"
homepage = "https://microsoft.github.io/webui"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
thiserror = "2.0.18"
anyhow = "1.0.104"
log = "0.4.34"
env_logger = "0.11.11"
tokio = { version = "1.53.1", features = ["full"] }
clap = { version = "4.6.3", features = ["derive", "color"] }
console = "0.16.6"
rayon = "1.12.0"
ctrlc = "3.5.2"
prost = "0.14.4"
yoke = { version = "0.8.3", features = ["derive"] }
napi = { version = "3.12.4", features = ["napi4"] }
napi-derive = "3.6.5"
pyo3 = { version = "0.29.2", features = ["abi3-py311", "generate-import-lib"] }
wasm-bindgen = "=0.2.127"
js-sys = "0.3.104"
serde-wasm-bindgen = "0.6.5"
actix-web = "4.15.0"
rustls = "0.23.45"
rcgen = "0.14.9"
awc = "3.8.2"
hmac = "0.13.0"
sha2 = "0.11.0"
expand-tilde = "0.6.1"
mime_guess = "2.0.5"
html-escape = "0.2.15"
include_dir = "0.7.4"
async-stream = "0.3.6"
futures-util = "0.3.33"
tokio-stream = "0.1.19"
bytes = "1.12.1"
crossbeam-queue = "0.3.14"
memchr = "2.8.3"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
percent-encoding = "2.3.2"
walkdir = "2.5.0"
toml = "1.1.6"
comrak = { version = "0.55.0", default-features = false }
syntect = { version = "5.3.0", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-onig"] }
serde_yaml = "0.9.34"
libc = "0.2.189"
time = { version = "0.3.55", features = ["local-offset", "formatting", "macros"] }
which = "8.0.6"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

# Test dependencies
criterion = "0.8.2"
tempfile = "3.27.0"

# Build dependencies
prost-build = "0.14.4"
napi-build = "2.4.2"
cbindgen = "0.29.4"

[workspace.lints.clippy]
# Lint groups (lower priority so individual lints can override)
perf = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
# Performance
large_enum_variant = "deny"
large_stack_arrays = "deny"
large_futures = "deny"
needless_collect = "deny"
redundant_clone = "deny"
unnecessary_to_owned = "deny"
inefficient_to_string = "deny"
manual_memcpy = "deny"
naive_bytecount = "deny"
# Security & correctness
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
# Memory discipline
rc_buffer = "deny"
large_types_passed_by_value = "deny"
vec_box = "deny"
unnecessary_box_returns = "deny"
# Documentation
# doc_markdown = "warn"  # TODO: enable after fixing 101 existing violations

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.dev]
opt-level = 0
