<template shadowrootmode="open">
  <!-- THESIS: Read the evidence, not a leaderboard.
       OWN-WORLD: Measurement atlas; blue ink, cobalt rules, system type, unfilled refresh markers.
       STORY: Separate browser memory, paint, and server throughput, then inspect the caveats.
       FIRST VIEWPORT: Native metric controls, visible limitations, a zero-based plot with full labels.
       FORM: The established site's evidence sheet, with one plot and an inspectable all-metric table. -->
  <section class="benchmark-explorer" aria-labelledby="benchmark-title">
    <div class="benchmark-toolbar">
      <h2 id="benchmark-title">One workload. Different measurements</h2>
      <p>Choose a metric, not an overall score. All 16 cases remain in view.</p>
      <div class="benchmark-mobile-metric">
        <label for="benchmark-metric-select">Measurement to plot</label>
        <select
          id="benchmark-metric-select"
          value="{{benchmarks.selectedMetric}}"
          ?disabled="{{!ready}}"
          aria-describedby="benchmark-control-help"
          @change="{selectMetricFromInput(e)}"
        >
          <for each="metric in benchmarks.metrics">
            <option value="{{metric.id}}" ?selected="{{metric.selected}}">{{metric.label}} ({{metric.unit}})</option>
          </for>
        </select>
      </div>
      <div class="benchmark-metrics" role="group" aria-label="Measurement to plot">
        <for each="metric in benchmarks.metrics">
          <button
            type="button"
            data-metric="{{metric.id}}"
            ?data-selected="{{metric.id == benchmarks.selectedMetric}}"
            aria-pressed="{{metric.selected}}"
            ?disabled="{{!ready}}"
            @click="{selectMetric(metric.id)}"
          >
            <span>{{metric.label}}</span>
            <small>{{metric.unit}}</small>
            <if condition="metric.id == benchmarks.selectedMetric">
              <span class="visually-hidden">, selected</span>
            </if>
          </button>
        </for>
      </div>
      <p class="benchmark-no-script" id="benchmark-control-help">The initial plot and complete data table work without JavaScript. Switching the plot uses optional JavaScript.</p>
    </div>

    <figure class="benchmark-figure" aria-labelledby="benchmark-figure-title" aria-describedby="benchmark-caption">
      <div class="benchmark-figure-heading">
        <h3 id="benchmark-figure-title" aria-live="polite" aria-atomic="true">{{benchmarks.activeMetric.label}} <span>{{benchmarks.activeMetric.unit}}</span></h3>
        <p class="benchmark-direction">{{benchmarks.activeMetric.directionLabel}}</p>
      </div>
      <p class="benchmark-description">{{benchmarks.activeMetric.description}}</p>
      <p class="benchmark-evidence-note">
        Historical, limited, mixed-refresh data. Browser metrics: 10 isolated runs. Server metrics: 1 measured round.
        Ordering is descriptive, not evidence of a statistically established winner.
      </p>
      <div class="benchmark-scale" aria-hidden="true">
        <span></span>
        <if condition="benchmarks.scaleAvailable">
          <div><span>0</span><span>{{benchmarks.midpointLabel}}</span><span>{{benchmarks.maximumLabel}} {{benchmarks.activeMetric.unit}}</span></div>
        </if>
        <if condition="!benchmarks.scaleAvailable">
          <div class="benchmark-empty-scale">No available measurements</div>
        </if>
        <span></span>
      </div>
      <ol class="benchmark-plots" role="list" aria-label="{{benchmarks.activeMetric.label}}, sorted by recorded value">
        <for each="row in benchmarks.rows">
          <li key="{{row.caseId}}" class="benchmark-row" data-case="{{row.caseId}}">
            <span class="benchmark-case">
              {{row.label}}
              <if condition="row.refreshed"><span class="benchmark-refresh" aria-label="Selectively refreshed 2026-09-04">◇</span></if>
            </span>
            <svg
              class="benchmark-plot"
              viewBox="0 0 100 20"
              preserveAspectRatio="none"
              role="img"
              aria-label="{{row.label}}: {{row.valueLabel}}"
            >
              <title>{{row.label}}: {{row.valueLabel}}</title>
              <desc>Linear bar from zero to {{benchmarks.maximumLabel}} {{benchmarks.activeMetric.unit}}. {{row.refreshLabel}}. Equivalent values and notes are in the data table.</desc>
              <path class="benchmark-grid" d="M0 0V20 M50 0V20 M100 0V20"></path>
              <if condition="row.available">
                <rect class="benchmark-bar" x="0" y="5" width="{{row.barWidth}}" height="10"></rect>
                <if condition="row.zero"><path class="benchmark-zero" d="M0 3V17"></path></if>
              </if>
              <if condition="!row.available">
                <path class="benchmark-missing" d="M46 6L54 14 M46 14L54 6"></path>
              </if>
            </svg>
            <span class="benchmark-value">{{row.valueLabel}}</span>
          </li>
        </for>
      </ol>
      <figcaption id="benchmark-caption">
        All bars start at zero and share the same linear scale. Values are sorted
        {{benchmarks.activeMetric.direction}} first; small differences are not proof of significance.
        <span class="benchmark-refresh">◇</span> marks the three selectively refreshed WebUI hosts (2026-09-04).
        Unmarked cases retain earlier results. Lower memory is not a universal performance score.
      </figcaption>
      <if condition="benchmarks.unavailableCount > 0">
        <p class="benchmark-unavailable">{{benchmarks.unavailableCount}} unavailable measurements are retained at the end, with a cross instead of a bar. Unavailable never means zero.</p>
      </if>
      <details class="benchmark-method">
        <summary>Recorded setup for {{benchmarks.activeMetric.label}}</summary>
        <p>{{benchmarks.activeMetric.methodology}}</p>
        <p>The summary does not establish every measured version, a complete environment record, or the browser response mode. See the provenance limits below.</p>
      </details>
    </figure>

    <details class="benchmark-data-table">
      <summary>Data table and measurement notes <span>16 cases · all 5 metrics</span></summary>
      <p>All five metrics are present without JavaScript. The table follows the plot's order.
        At narrow widths, scroll the table horizontally. Expand a case for its selected-metric notes.</p>
      <div class="benchmark-table-scroll" role="region" aria-label="All benchmark measurements" tabindex="0">
        <table>
          <caption>Historical results. Memory in MiB (1 MiB = 1,048,576 bytes); LCP in ms; throughput in req/s.</caption>
          <thead>
            <tr>
              <th scope="col">Case and recorded notes</th>
              <th scope="col">JS heap<br><small>MiB · lower</small></th>
              <th scope="col">Renderer private<br><small>MiB · lower</small></th>
              <th scope="col">LCP<br><small>ms · lower</small></th>
              <th scope="col">Complete<br><small>req/s · higher</small></th>
              <th scope="col">Progressive<br><small>req/s · higher</small></th>
            </tr>
          </thead>
          <tbody>
            <for each="row in benchmarks.rows">
              <tr key="{{row.caseId}}" data-case="{{row.caseId}}">
                <th scope="row">
                  {{row.label}}
                  <details class="benchmark-case-notes">
                    <summary>{{benchmarks.activeMetric.label}} notes</summary>
                    <p>{{row.detail}}</p>
                    <p>{{row.refreshLabel}}. The measured framework/runtime versions are not fully recorded.</p>
                  </details>
                </th>
                <td ?data-active="{{benchmarks.selectedMetric == 'jsHeapUsedBytes'}}">{{row.values.jsHeapUsedBytes.display}}</td>
                <td ?data-active="{{benchmarks.selectedMetric == 'rendererPrivateBytes'}}">{{row.values.rendererPrivateBytes.display}}</td>
                <td ?data-active="{{benchmarks.selectedMetric == 'largestContentfulPaintMs'}}">{{row.values.largestContentfulPaintMs.display}}</td>
                <td ?data-active="{{benchmarks.selectedMetric == 'noStreamingRequestsPerSecond'}}">{{row.values.noStreamingRequestsPerSecond.display}}</td>
                <td ?data-active="{{benchmarks.selectedMetric == 'streamingRequestsPerSecond'}}">{{row.values.streamingRequestsPerSecond.display}}</td>
              </tr>
            </for>
          </tbody>
        </table>
      </div>
      <p class="benchmark-table-note">MAD and p95 in the supplied notes are descriptive. In particular, server MAD of zero from one round cannot establish variability or confidence.</p>
    </details>
    <p class="benchmark-download">
      <a href="benchmarks/historical-results.json" download="webui-historical-results.json">Download the displayed data (JSON)</a>
      <span>Five metrics, all cases, and the same limitations. Not a complete reproducibility package.</span>
    </p>
  </section>
</template>
