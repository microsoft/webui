[package]
name = "microsoft-webui-node"
description = "Separate runtime and build Node.js native addons for WebUI via napi-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["webui", "nodejs", "napi", "ssr", "rendering"]
categories = ["api-bindings", "web-programming"]

[lib]
name = "webui_node"
crate-type = ["cdylib"]

[features]
default = ["handler"]
handler = ["dep:microsoft-webui-handler", "dep:microsoft-webui-protocol"]
build = ["dep:microsoft-webui", "dep:tokio"]

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
microsoft-webui-handler = { path = "../webui-handler", version = "3.1.2", optional = true }
microsoft-webui-protocol = { path = "../webui-protocol", version = "3.1.2", optional = true }
microsoft-webui = { path = "../webui", version = "3.1.2", optional = true, features = ["browser-build"] }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true }

[build-dependencies]
napi-build = { workspace = true }

[dev-dependencies]
microsoft-webui-parser = { path = "../webui-parser", version = "3.1.2", default-features = false }
microsoft-webui-protocol = { path = "../webui-protocol", version = "3.1.2", features = ["projection-manifest"] }
tempfile = { workspace = true }

[lints]
workspace = true
