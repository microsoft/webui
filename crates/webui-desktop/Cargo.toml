[package]
name = "microsoft-webui-desktop"
description = "Configurable native desktop SDK for WebUI applications"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["webui", "desktop", "webview", "ipc", "ssr"]
categories = ["gui", "web-programming"]

[lib]
name = "webui_desktop"

[[bin]]
name = "webui-desktop"
path = "src/cli/main.rs"
required-features = ["cli"]

[features]
default = []
native = [
    "dep:anyhow",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:objc2-web-kit",
    "dep:block2",
    "dep:webview2-com",
    "dep:windows",
    "dep:windows-core",
    "dep:gtk4",
    "dep:webkit6",
]
source = ["dep:microsoft-webui", "dep:sha2"]
cli = ["native", "source", "dep:clap", "dep:console", "dep:expand-tilde", "dep:microsoft-webui-desktop-build"]

[dependencies]
microsoft-webui = { path = "../webui", version = "0.0.29", features = ["cli"], optional = true }
microsoft-webui-handler = { path = "../webui-handler", version = "0.0.29" }
microsoft-webui-protocol = { path = "../webui-protocol", version = "0.0.29" }
microsoft-webui-tokens = { path = "../webui-tokens", version = "0.0.29" }
microsoft-webui-desktop-build = { path = "../webui-desktop-build", version = "0.0.29", optional = true }
mime_guess = { workspace = true }
percent-encoding = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true }
futures-channel = { workspace = true }
futures-executor = { workspace = true }
futures-util = { workspace = true }
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
console = { workspace = true, optional = true }
expand-tilde = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true, features = ["std", "objc2-core-foundation", "NSApplication", "NSAppearance", "NSButton", "NSColor", "NSControl", "NSEvent", "NSGraphics", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSScreen", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSVisualEffectView", "NSWindow"] }
objc2-foundation = { workspace = true, optional = true, features = ["std", "block2", "NSData", "NSDictionary", "NSDistributedNotificationCenter", "NSURL", "NSURLRequest", "NSURLResponse", "NSString", "NSObject", "NSNotification", "NSGeometry", "NSValue", "NSJSONSerialization", "NSStream", "NSTimer", "NSDate"] }
objc2-web-kit = { workspace = true, optional = true, features = ["std", "objc2-app-kit", "objc2-core-foundation", "block2", "WKURLSchemeHandler", "WKURLSchemeTask", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKScriptMessage", "WKScriptMessageHandler", "WKScriptMessageHandlerWithReply", "WKContentWorld", "WKFrameInfo", "WKSecurityOrigin", "WKUserContentController", "WKUserScript"] }
block2 = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
webview2-com = { workspace = true, optional = true }
windows = { workspace = true, optional = true, features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-core = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { workspace = true, optional = true, features = ["v4_10"] }
webkit6 = { workspace = true, optional = true, features = ["v2_42"] }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "macos_response"
harness = false
required-features = ["native"]

[lints]
workspace = true
