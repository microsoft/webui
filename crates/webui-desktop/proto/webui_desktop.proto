syntax = "proto3";

package webui.desktop;

message IpcFrame {
  uint32 version = 1;
  fixed64 generation = 2;
  fixed64 id = 3;
  Kind kind = 4;
  uint32 method_id = 5;
  uint32 timeout_ms = 6;
  oneof body {
    bytes payload = 7;
    WireError error = 8;
  }
}
enum Kind {
  KIND_UNSPECIFIED = 0;
  REQUEST = 1;
  RESULT = 2;
  ERROR = 3;
  NOTIFY = 4;
  ACCEPT = 5;
  CANCEL = 6;
}
message WireError {
  string code = 1;
  string message = 2;
  string help = 3;
  string application_code = 4;
}
