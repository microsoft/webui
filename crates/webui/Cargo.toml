[package]
name = "microsoft-webui"
description = "Programmatic API for the WebUI build-time rendering framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["webui", "ssr", "rendering", "templates", "server-side"]
categories = ["web-programming", "template-engine"]

[lib]
name = "webui"

[features]
cli = ["microsoft-webui-parser/cli"]
browser-build = [
    "dep:microsoft-webui-projection",
    "dep:rolldown",
    "dep:rolldown_common",
    "dep:rolldown_error",
    "dep:either",
    "dep:oxc",
    "dep:string_wizard",
    "dep:base64",
    "dep:mime_guess",
    "dep:anyhow",
    "dep:tempfile",
]

[dependencies]
microsoft-webui-parser = { path = "../webui-parser", version = "3.2.0" }
microsoft-webui-protocol = { path = "../webui-protocol", version = "3.2.0", features = ["projection-manifest", "content-identity"] }
microsoft-webui-handler = { path = "../webui-handler", version = "3.2.0", features = ["packs"] }
microsoft-webui-discovery = { path = "../webui-discovery", version = "3.2.0" }
microsoft-webui-tokens = { path = "../webui-tokens", version = "3.2.0" }
microsoft-webui-projection = { path = "../webui-projection", version = "3.2.0", optional = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
memchr = { workspace = true }
crossbeam-queue = { workspace = true }
crc32fast = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
brotli = { workspace = true }
rolldown = { workspace = true, optional = true }
rolldown_common = { workspace = true, optional = true }
rolldown_error = { workspace = true, optional = true }
either = { workspace = true, optional = true }
oxc = { workspace = true, features = ["transformer"], optional = true }
string_wizard = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
mime_guess = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
actix-web = { workspace = true }
reqwest = { workspace = true }
futures-util = { workspace = true }
libc = { workspace = true }
microsoft-webui-handler = { path = "../webui-handler", version = "3.2.0" }
microsoft-webui-protocol = { path = "../webui-protocol", version = "3.2.0", features = ["projection-manifest"] }

[[test]]
name = "browser_build"
required-features = ["browser-build"]

[[test]]
name = "browser_build_generalized"
required-features = ["browser-build"]

[[test]]
name = "browser_build_parallel"
required-features = ["browser-build"]

[[test]]
name = "browser_build_policy"
required-features = ["browser-build"]

[[test]]
name = "browser_build_publication"
required-features = ["browser-build"]

[[test]]
name = "browser_build_publication_safety"
required-features = ["browser-build"]

[[test]]
name = "browser_build_warnings"
required-features = ["browser-build"]

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true }

[[bench]]
name = "contact_book_bench"
harness = false

[[bench]]
name = "streaming_bench"
harness = false

[[bench]]
name = "component_assets_bench"
harness = false

[[bench]]
name = "server_request_bench"
harness = false

[[bench]]
name = "lazy_bench"
harness = false

[[example]]
name = "streaming_resource_bench"
path = "examples/streaming_resource_bench.rs"

[[example]]
name = "streaming_e2e_ttfb_bench"
path = "examples/streaming_e2e_ttfb_bench.rs"

[lints]
workspace = true
