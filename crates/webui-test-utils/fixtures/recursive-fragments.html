<fragment name="heading"><h2>{{title}}</h2></fragment><fragment name="tree-items"><ul><for each="child in items"><li><span>{{child.name}}</span><if condition="child.children.length"><render fragment="tree-items" scope="{{child.children}}" as="items"></render></if></li></for></ul></fragment><render fragment="heading"></render><render fragment="tree-items" scope="{{items}}" as="items"></render>
